# Balanced default run across all three platforms - images and carousels, reels off
# See prds/30-configuration-and-run.md §2 for the full field reference

# FR-173: the config picker prints this line verbatim, so the file names ITSELF rather than
# letting the menu derive a line from `niche:` (two sibling niches can share a byte-identical
# block and would then render identically). Budget: <= 55 chars, and ASCII only - the picker
# row must survive a legacy cp437/cp852 console, so no box drawing, no check marks, no colour.
# This template ships with `sources.virlo_monitor_ids: []` DELIBERATELY (see that key below),
# which is why the label says so out loud instead of leaving the operator to discover it at
# pre-flight.
label: "neutral template - no monitor ids yet, not runnable"

run:
  formats: { image: 0, carousel: 6, reel: 0 }   # ALL-CAROUSELS (v2.1.0/D46 §0.3, operator default;
                                   # was 4/2/0). v1 of the slideshow pivot fetches SLIDESHOWS only
                                   # (sources.include_videos below), so every topic is
                                   # slideshow-majority and a carousel is the only format that can
                                   # quote one panel for panel (FR-304). Raising image or reel here
                                   # without also setting include_videos: true is REFUSED at load
                                   # (§0.14e) rather than silently rank-falling-back. Reels also
                                   # stay OFF until price_per_unit.reel_second is real (FR-131).
  platforms: [linkedin, instagram, tiktok]
  languages: { linkedin: en, instagram: en, tiktok: en }   # en | cs per platform (D6). Post-D42
                                   # this is the language SLOT a creative is planned for, not a
                                   # translation order: topic-driven copy is quoted verbatim from
                                   # the source post, so a Czech slot fed by English posts ships
                                   # English text. It still fully governs the free-text creatives
                                   # (override briefs, post-less topics), which are the only copy
                                   # the model still writes.
  notion_influence: off            # off | copy | full (needs NOTION_TOKEN + pages shared once)
  gauntlet:                        # v2.2.0/D49: the three-critic post-render gate (FR-322-330).
                                   # OFF since the SESSION 5 live acceptance (2026-08-14): 3/3 decks
                                   # blocked, 2 on defect classes Phase 1 owed (source-chrome counter
                                   # polluting the contract; list-treatment guidance hard-trimmed out
                                   # of over-budget prompts). Re-enable only after those fixes; see
                                   # plans/carousel-gauntlet/SESSION-5-LIVE-ACCEPTANCE.md.
                                   # Three fresh-context critics look at the frames Kie actually
                                   # returned and judge them against contract data - the words the
                                   # frame was ORDERED to carry, the logos it must and must not
                                   # show, the style it was rendered in. Failing frames re-render
                                   # with a canned fix instruction and are judged again. A deck
                                   # still leaking a creator identity or a competitor mark at the
                                   # end is BLOCKED: kept on disk, never published.
    enabled: true                  # Re-enabled 2026-08-20 after Sessions 5.5-5.8 fixed findings
                                   # F1-F9 (four canaries; see plans/SESSION-5.8-CLOSEOUT.md).
                                   # false = NO post-render gate at all (renders ship unread);
                                   # it does not fall back to the old vision check - that is gone.
    rounds_max: 3                  # rounds per DECK, bounds 1-6. Round 1 finds the defect, round 2
                                   # fixes it, round 3 catches what the fix broke. The single
                                   # biggest cost dial here - each round is re-renders plus a full
                                   # critic pass - and it is also what run_deadline_min is sized
                                   # against (see that key below).
    rounds_max_image: 1            # rounds for standalone images and reel seed frames, bounds 0-3.
                                   # Lower because there is no deck to hold together. `0` judges
                                   # and reports without ever paying for a second render.
    deck_budget_usd: 0.30          # per-deck re-render cap, bounds 0.00-2.00. A REAL gate: the
                                   # deck stops re-rendering when it is reached. (The Confirm
                                   # gate's gauntlet lines are an allowance - shown and provisioned
                                   # for, never trimming a creative, FR-106a.)
    fail_action: degrade           # block | degrade - what a standing CONTRACT-tier defect does.
                                   # Operator decision 2026-08-20 (canary #4, F10): contract defects
                                   # ship TAGGED for gallery review; only leakage still hard-blocks
                                   # after the last round. The LEAKAGE tier (identity, forbidden
                                   # marks, platform chrome, invented or translated text) ignores
                                   # this and always blocks; no setting may sanction a person's
                                   # name or a competitor's logo on a published frame.
    craft_blocks: false            # craft-only standings (contrast, composition) ship with a
                                   # GAUNTLET_CRAFT tag by default - they are opinions about
                                   # quality. `true` makes them terminal too.
    critics:                       # model: null = use models.critic below; set one to override
      brief:  { enabled: true,  model: null }   # contract fidelity + leakage - PRESENCE, never
                                                # quality: are the ordered words there, and is
                                                # anything there that must not be
      system: { enabled: true,  model: null }   # style contract + cross-frame consistency: does
                                                # this read as ONE deck while you swipe it
      craft:  { enabled: true,  model: null }   # execution quality - EXECUTION, never content:
                                                # garbled lettering, contrast, composition
  spend_cap_usd: 10.00             # pre-flight control; --yes trims to fit, interactive refuses
  trend_history_days: 30           # post-ID no-repeat window in days (v2.1.0/FR-307, was 7). It
                                   # must be >= sources.max_post_age_days below, or a post drops
                                   # out of history while it is still being fetched and gets quoted
                                   # twice - that pair is REFUSED at load, never clamped. `0`
                                   # disables the window entirely and is the explicit opt-out, so
                                   # it is exempt from the check.
  max_trend_reuses_per_run: 6      # how many creatives may share one TOPIC. Was 2 until
                                   # 2026-08-11, when D36's post-level recency made a higher
                                   # number safe (exclusion is per POST now, so reuse is no
                                   # longer a throughput ceiling). Post-pivot it is also what
                                   # makes siblings interesting: each reuse of a topic gets its
                                   # own meta-style from the rotation and quotes a DIFFERENT
                                   # source post of that topic (FR-99/FR-291), so six siblings
                                   # are six different-looking posts, not six near-duplicates.
  carousel_anchor: true            # slide 1 renders first and references slides 2-N
  carousel_copy_mode: verbatim     # verbatim | compress (v2.3.0/D54/FR-333) - how a BOUND
                                   # carousel deck's source panels reach its slides. `verbatim`
                                   # renders each mapped panel exactly as FR-304 admitted it,
                                   # and D50's "reflow, never shorten" governs that mode.
                                   # `compress` sends the SAME admitted panels back to the copy
                                   # model to come out inside min(text_budgets.slide, the
                                   # assigned style's own max_onimage_chars.slide), humanised,
                                   # still in the source post's own language: one grouped copy
                                   # call per (topic x language) pair of panel-mapped decks, on
                                   # the standard `copy` role and inside the pre-flight
                                   # estimate. What does NOT change with the mode: the 1:1
                                   # panel-to-slide mapping, the deck's length, and the three
                                   # reasons a panel drops to a wordless slide that KEEPS its
                                   # position (FR-304). A failed compress call falls back to
                                   # the verbatim mapped deck, tagged `copy_degraded`.
                                   # CAROUSELS ONLY - images, reels, override briefs and decks
                                   # with no source post behind them never read this key.
                                   # `verbatim` is the ENGINE default and the stricter
                                   # contract, and since D58 (2026-08-20) it is also what all
                                   # three shipped brand configs use - the D54 pin of
                                   # `compress` is WITHDRAWN. That pin existed because the
                                   # four-key minimal-density pool of the day declared 160-300
                                   # character slide budgets while a real source panel ran
                                   # several times that (measured: 1,018-1,048 chars on a
                                   # 180-char budget). D56's archetypes give such a panel a
                                   # better LAYOUT but not a bigger BUDGET - they share the
                                   # registry's 300-char ceiling with 9 of 19 styles, and
                                   # FR-304a forbids a budget from dropping mapped text, so
                                   # verbatim run 20260820_145809_4a0q shipped 500-1,180 char
                                   # panels onto 300-char frames (8 of 9 decks over budget).
                                   # D58 is an operator PREFERENCE with that cost accepted.
                                   # Compress is unchanged and fully supported - pin it here
                                   # or use the per-run override: `run.bat --copy-mode compress`.
  reel_overlay_text: seed_frame    # seed_frame | in_model | none
  reel_audio: true                 # Seedance generate_audio; false ships a silent clip
  reel_duration_s: 5               # 4-30 (Seedance verified range); out-of-range is CLAMPED at pre-flight
  reel_resolution: 720p            # 480p | 720p (480p = the cheap test option)
  nsfw_checker: true               # provider knob, always sent (provider's own default is false)
  onimage_text_language: {}        # per-platform override for on-image text; else the caption language
  text_budgets:                    # on-image character ceilings, enforced BEFORE submission (FR-101)
                                   # RAISED at v2.1.0 (D46 §0.5/FR-259). The old numbers were sized
                                   # for text the model WROTE; on-image strings are now verbatim
                                   # quotes of a source panel/hook/overlay that nobody may trim
                                   # (FR-304), so a ceiling under a real panel does not shorten it -
                                   # it makes it unofferable and the creative ships with no text at
                                   # all. A style's own max_onimage_chars may still only LOWER
                                   # these, never raise them.
    image_headline: 90             # was 42
    image_subline: 160             # was 60
    slide: 300                     # NEW: per-slide deck text on panel-mapped carousels (FR-304)
    reel_seed_headline: 60         # was 32
    retry_reduction_pct: 40        # cut budgets by this % on a vision-check retry
  run_deadline_min: 60             # soft elapsed ceiling, monotonic clock (FR-108). Raised
                                   # 25 -> 45 in v2.1.3/D48 (image_job_timeout_s is 600 s and
                                   # FR-317 grants each image job one resubmit), then 45 -> 60 in
                                   # v2.2.0/D49: the gauntlet above adds up to rounds_max-1 further
                                   # render waves AFTER that worst case. At the shipped numbers a
                                   # full 20-slide deck is 4 waves + 2 gauntlet rounds x 600 s =
                                   # exactly 60 min, which is why this is the number.
                                   # DEPENDS ON models.video_job_timeout_s below: turn
                                   # reels on and it must exceed that timeout plus the
                                   # filter/copy/image stages, or the deadline abandons the run
                                   # before a slow reel can ever finish.

sources:
  active: [virlo]                  # google_trends, hacker_news: named in the picker, not built yet
  virlo_monitor_ids: []            # run `run.bat --list-monitors` to print yours (FR-251)
  virlo_session_pool: 3            # bounded wrapper sessions; never one subprocess per monitor
  virlo_topics_per_monitor: 9      # TOPICS one monitor may contribute (FR-293/FR-170). Virlo is a
                                   # TEXT-ONLY source post-pivot: a monitor's analysis is split
                                   # into themes, and each theme becomes a topic with its own
                                   # view-ranked posts and its own strength, min-maxed across the
                                   # run. This caps the split so one prolific monitor cannot flood
                                   # the pool it is ranked in. `-1` = the kill switch, one topic
                                   # per monitor (pre-pivot cardinality); `0` is refused as a
                                   # config error - drop the monitor instead of muting it.
  include_videos: false            # v2.1.0/FR-301: when false the fetch gate skips Virlo's VIDEO
                                   # rows and yields slideshows only. A slideshow is a deck, and a
                                   # deck is what a carousel reproduces panel for panel (FR-304); a
                                   # video row has no panels. Turning this on is also what unlocks
                                   # run.formats image/reel counts above (§0.14e).
  fetch_pages: 3                   # v2.1.0/FR-301: result pages pulled per monitor at
                                   # `created_at desc` - ~100 posts a page, so 3 is roughly the last
                                   # week of a normally active monitor. Bounds 1-10, REFUSED out of
                                   # range rather than clamped (FR-285): a quietly corrected typo
                                   # would change which posts a paid run quotes without saying so.
  max_post_age_days: 30            # v2.1.0/FR-301: posts older than this are dropped pre-rank as
                                   # stale, measured on the post's own publish_date. This is the fix
                                   # for the run that ranked by views over ALL TIME and quoted posts
                                   # from 2023. Bounds 0-365; `0` disables the cap. Must be <=
                                   # run.trend_history_days above (FR-307, refused at load).
  vision_transcribe: true          # v2.1.0/FR-306: after the Confirm gate, download the assigned
                                   # carousel source posts' slides and have the analysis model
                                   # transcribe their on-image text and describe their visuals, so
                                   # our slides reproduce the CONTENT in our own style. Paid LLM
                                   # spend, estimated before Confirm and never run ahead of it.
                                   # `false` relies on Virlo's own panel_texts alone - cheaper, and
                                   # blind wherever that field is empty (many fresh rows are).

# Which of the authored meta-styles this run may rotate over (v2.1.2/FR-314/D-E). A SELECTOR only:
# the registry itself stays a prompt artifact - prompts/styles.yaml (FR-290) owns every render
# prompt, palette and layout zone, and nothing here carries style content. Naming a key the
# registry does not define is a pre-flight refusal (exit 2, $0), and so is a selection that leaves
# a requested format with no affine style under the active brand - both name what the registry
# really offers. The old `styles.refs_per_job` window died with D46/F3 (a text-only style ships no
# reference images) and is not coming back; this key replaces nothing it did.
styles:
  enabled: []                      # FR-314 selector: style keys from prompts/styles.yaml to use
                                   # this run; EMPTY = all of them, which is the pre-FR-314
                                   # behaviour and the shipped state. Per-run override:
                                   # `run.bat --styles key1,key2`. Use it to curate the look of one
                                   # batch (D-G: colour is curated by choosing styles, never by
                                   # editing a style, which would change every later run too;
                                   # v2.4.0/D57's `-teal` variants are that rule APPLIED, not an
                                   # exception to it - each is a NEW registry entry selected
                                   # through this key, and the original it was copied from is
                                   # untouched, so a run that does not name the variant still
                                   # renders exactly what it always rendered).
                                   # Filtering order: branding.brand first (brand_affinity, B3),
                                   # then this list, then FR-291's format-affine scan - so a
                                   # selection of three rotates in the order those three appear in
                                   # the registry file.
  assignment: rotation             # v2.4.0/FR-334 (D56): WHICH ALGORITHM assigns a style to a
                                   # creative. Distinct from the `styles.rotation` key
                                   # (`seeded | fixed`, engine default `seeded`, not spelled out
                                   # in this file), which only chooses where the deterministic
                                   # scan STARTS: `assignment` chooses which algorithm runs at
                                   # all, and `assignment: rotation` still obeys
                                   # `styles.rotation: seeded|fixed` underneath.
                                   # `rotation` (this default) is FR-291 unchanged - each pick a
                                   # pure function of entry.order over the format-affine pool, so
                                   # a $0 preview forecasts the paid run key by key and two runs
                                   # of one config assign alike.
                                   # `matched` adds ONE batched, fail-open LLM screen at ASSIGN,
                                   # on the `analysis` role and quoted at the Confirm gate as
                                   # `style_match_call`, which reads each creative's own source
                                   # signals - caption, hooks, panel texts, panel count, Virlo's
                                   # hook/visual/emotion classes - and picks the best-fitting
                                   # style out of the enabled pool above. It never replaces the
                                   # deterministic rotation, it OVERLAYS it: the FR-291 pick is
                                   # computed first and is what an entry KEEPS when the matcher
                                   # answers `low` fit, names a style outside that entry's pool
                                   # or skips the row, and what the WHOLE plan keeps when the
                                   # call itself fails - that run is tagged
                                   # `style_match_degraded`, warns once, and continues.
                                   # The trade is reproducibility for fit: matched picks are not
                                   # stable run to run, which is why the engine default stays
                                   # `rotation` and why `rotation` restores pre-D56 behaviour
                                   # byte-exactly. The three shipped brand configs pin `matched`,
                                   # because their twelve-style D57 pool under plain rotation
                                   # would be visual chaos - narrow `enabled` again before
                                   # turning the matcher off there.

# Brand identity for branded creatives (FR-292/D43), replacing the retired `niche.brand` keys.
# TWO CHANNELS, deliberately: the WORDMARK is quoted into the render prompt's TEXT block (never
# composited, never invented by the model), and everything else here reaches the prompt through the
# branding block, ranked BELOW the assigned meta-style - branding tints and signs a style, it never
# replaces one. Notion brand facts are a FUTURE override of these keys, not a dependency: these
# values are the MVP source of truth.
branding:
  enabled: false                   # FR-318 MASTER SWITCH (operator decision, 2026-08-13). While
                                   # this is false NOTHING self-brands: no creative is signed
                                   # (brand_ratio is inert), no branding block reaches a render
                                   # prompt, the copy LLM gets no brand facts, and a
                                   # `brand_slot: true` house-card style leaves the rotation.
                                   # Flip to `true` to re-enable the wordmark and the branded
                                   # rotation - every key below then applies as written.
                                   # SAFETY IS NOT GATED: `competitors` below, and every
                                   # creator/competitor strip built on it (FR-294/FR-312), stay
                                   # fully active either way. This switch decides how WE sign a
                                   # creative, never whose name is allowed into our pixels.
  brand: hypedigitaly              # SELECTOR, never a mix: hypedigitaly (parent/corporate) or
                                   # hypelead (product). It also filters the style rotation - a
                                   # style whose `brand_affinity` names the other brand is not
                                   # assignable (B3). The shipped niche configs pick `hypelead`,
                                   # whose house kit the registry's brand-card style is built from.
  brand_ratio: 0.5                 # fraction of the plan that carries the wordmark, as a floor
                                   # predicate on entry.order (FR-291): `floor(N x ratio)` signed,
                                   # deterministic, and stable when a later trim drops entries.
                                   # 0 = never signed, 1 = every creative signed (reads as a
                                   # watermark across a feed, which is why 0.5 is the default).
  mode: overlay                    # background_tint | overlay | both. `overlay` leaves the style's
                                   # own ground alone; `background_tint` also hands the model the
                                   # profile's `background_hint`, a much stronger claim on the frame.
  placement: bottom-center         # wordmark placement hint, honoured through the TEXT block entry
  competitors: []                  # DETERMINISTIC blocklist, layer 1 of the topic filter (FR-294):
                                   # matched in code, so it still holds when the LLM screen
                                   # degrades. Fail-closed - "the model was unavailable" must never
                                   # be why a rival's name ships in our pixels. Our own
                                   # product_nouns are protected from being stripped as competitors.
  profiles:                        # The two house brand systems, spelled out so they are visible
                                   # and editable here and not only in code. These ARE the compiled
                                   # defaults; override any single key - the loader merges key by
                                   # key, so one colour edit keeps the rest of the profile intact.
    hypedigitaly:                  # parent / corporate: indigo->teal gradient, Montserrat
      wordmark: "HypeDigitaly"     # CamelCase, no space; rendered one weight, one colour
      colors:
        indigo: "#34288B"
        teal: "#00A59A"
        gradient: ["#34288B", "#2B3F8E", "#0C8897", "#00A59A"]   # indigo -> blue -> teal, L to R
      fonts: { brand: "Montserrat", web: "Geist" }
      # A render model cannot install a font, so the font is DESCRIBED, not named at it (F21).
      font_character: "Montserrat — geometric grotesque, near-circular bowls, medium x-height, uniform stroke"
      background_hint: "flat royal-indigo field, gradient arrow glyphs sweeping the right half, vast negative space"
      # COLOUR guards - injected into EVERY branded prompt under this brand, whatever style was
      # assigned. Orange #F97316 is a website-only accent that appears in no brand asset, so it is
      # in neither profile's colours and both name it here to keep it out of the pixels.
      never_always: ["no teal pill highlights", "no dot-grid ground", "no orange #F97316 (web-only)"]
      never_style: []              # MEDIUM guards, applied only under brand-affine styles; the
                                   # corporate system has no medium of its own to defend.
      # Our own product names: copy may use them, and the topic filter must never "strip a
      # competitor brand" that is one of these (M15).
      product_nouns: ["AI Audit", "HypeLead", "AI Chatbot", "AI Voicebot", "AI Agent", "AI Automatizace"]
    hypelead:                      # product: teal-only, Geist, pill grammar - never mixed with the above
      wordmark: "HypeLead"
      colors:
        teal_bright: "#0FCFC4"
        teal_mid: "#57E6DC"
        teal_deep: "#0A7F78"
        teal_light: "#8BF2E9"
        dark: "#14130F"            # reads as charcoal-GREEN under teal glow, not neutral black
        offwhite: "#FAFAF7"
      fonts: { primary: "Geist", mono: "Geist Mono" }
      font_character: "Geist — clean grotesque, tight tracking, even color"
      # ONE resolved variant on purpose (conductor decision, 2026-08-12 / M9): the kit also has a
      # charcoal-green dark mode, but a hint that offers the model a choice is a hint that makes two
      # different-looking posts from one setting. Swap the whole string for "charcoal-green ground
      # with vignette and teal glow" to run the dark mode instead.
      background_hint: "off-white ground with faint dot-grid and soft teal bloom"
      never_always: ["no indigo or violet", "no orange #F97316"]
      # Medium guards, brand-affine styles only: six of the seven neutral styles are legitimately
      # photographic or hand-drawn, so applying these everywhere would quietly ban most of the
      # registry the moment a creative got a wordmark (M6).
      never_style: ["no photography/stock/3D", "no serif or handwritten type", "teal is accent only, never full-bleed canvas"]
      product_nouns: ["HypeLead"]

platforms:
  # `formats` is each platform's allowlist (FR-132): a requested format outside it is dropped from
  # the plan with a logged reason, never an error.
  #
  # `carousel_slides` is the platform's HARD MAX, not a target (operator decision 2026-08-13, was
  # a flat 5 everywhere). A BOUND deck's length is the source post's own panel count clamped into
  # [2, this max] - so a 7-panel source ships 7 slides and a 3-panel source ships 3, which is the
  # 1:1 panel fidelity FR-304 asks for. Run 20260813_143420_oyo4 truncated every 5-8 panel deck to
  # 5 because this key was ALSO the target; it is only a ceiling now. Set it to what the platform
  # itself accepts, and nothing lower unless you want decks cut. Decks with no bound post (override
  # briefs, the pre-Collect estimate) do NOT use this number - they stay at plan.py's
  # DEFAULT_UNBOUND_DECK_SLIDES so the pre-bind estimate cannot balloon to the ceiling.
  #
  # PAIR WITH models.image_job_timeout_s and run.run_deadline_min: a taller max means more image
  # jobs per deck queued behind `max_inflight_render_jobs`, and the engine warns at load when the
  # worst-case full plan cannot plausibly finish inside the deadline.
  #
  # Aspect-ratio defaults are owned by prds/10-pipeline.md FR-21; `aspect_ratios` here is an
  # OVERRIDE map only.
  linkedin:
    formats: [image, carousel]
    carousel_slides: 20            # LinkedIn document/carousel posts accept well past this
    aspect_ratios: {}              # e.g. { image: "1:1" } to deviate from the FR-21 default
    conventions: {}                # caption length / tone / hashtag hints - prompt guidance only
  instagram:
    formats: [image, carousel]
    carousel_slides: 10            # Instagram's own hard ceiling is 10 (FR-257) - do not raise
    aspect_ratios: {}
    conventions: {}
  tiktok:
    formats: [image, carousel, reel]   # reels default to TikTok only
    carousel_slides: 20            # TikTok photo posts accept up to 35; 20 is the sane working max
    aspect_ratios: {}
    conventions: {}

models:
  analysis: anthropic/claude-sonnet-5       # OpenRouter chat id - the VISION CHECK role only.
                                            #   (The style-brief call this role used to make died
                                            #   with the pivot; the visual authority is now the
                                            #   local meta-style registry, FR-290.)
  copy: openai/gpt-5.6-luna                 # OpenRouter chat id - captions/hooks/on-image text
  # TWO image routes, TWO keys (FR-241/FR-280 as amended v2.1.3, D48). Each key overrides exactly
  # one half of the gpt-image-2 family and neither can reach the other:
  #   image      -> the route a job with NO references takes (text-to-image)
  #   image_edit -> the route a job WITH references takes  (image-to-image): a brief photo, the
  #                 carousel anchor slide 2-N chain to, a reel seed frame, a cropped logo patch
  # D48 fixed a live collapse here: `image` used to be the profile's only override, so setting it
  # to text-to-image (correct for the common no-reference job, v2.1.0) also dragged every
  # reference-BEARING job onto text-to-image, which accepts `input_urls` and ignores them. Run
  # 20260813_222101_g1xt logged "accepted gpt-image-2-text-to-image ... with 1 reference(s)" on
  # every anchored slide, and that is much of the anchor drift the operator reviewed.
  # Leaving either key empty falls back to the profile's own declared route, so both halves stay
  # correct even in a config that never mentions them.
  image: gpt-image-2-text-to-image          # Kie route, TEXT-TO-IMAGE - reference-free jobs only
  image_edit: gpt-image-2-image-to-image    # Kie route, IMAGE-TO-IMAGE - every reference-bearing
                                            #   job (brief photo, anchor chain, seed frame, logo
                                            #   patch). Pointing `image` here is what made the
                                            #   first paid run clone its inputs ~1:1; that is a
                                            #   reason to keep the keys apart, not to merge them.
  video: bytedance/seedance-2-5             # Kie route; needs price_per_unit.reel_second to plan
  # Profiles change ONLY on a model FAMILY change (e.g. Seedance -> Kling). A same-family swap is
  # just the id line above. An unknown profile is a pre-flight refusal, exit code 2 (FR-281).
  image_profile: gpt-image-2
  video_profile: seedance-2-5
  reasoning_effort: low            # models.copy role only; Luna bills reasoning tokens
  temperature: {}                  # DELIBERATELY EMPTY: neither shipped model advertises
                                   # `temperature`, and sending it with provider.require_parameters
                                   # returns HTTP 404 (spikes/RESULTS.md §E). Set it only for a
                                   # model whose OpenRouter catalog lists it. FR-129 needs D15.
  max_tokens: { analysis: 12000, copy: 3000 }  # sized for the GROUPED calls, not single answers.
                                   # The `copy` cap covers one grouped sibling call (FR-99). The
                                   # `analysis` cap is inherited headroom from the style-brief era
                                   # (raised 2000 -> 12000 on 2026-08-11 because every brief call
                                   # hit `llm_truncated`); the vision check that now owns the role
                                   # answers in a few hundred tokens, so the cap costs nothing -
                                   # max_tokens is a ceiling, only produced tokens are billed - and
                                   # it still absorbs Sonnet-5's unbidden reasoning tokens, which
                                   # are billed INSIDE completion_tokens even with reasoning_effort
                                   # unset for this role.
  max_tokens_floor: { analysis: 6000, copy: 1000 }  # NFR-111: a smaller max_tokens is clamped UP
                                   # to the floor with a warning - a tiny cap otherwise truncates
                                   # every call and makes the truncation retry the normal path.
                                   # The analysis floor was 600 and protected nothing; 6000 is kept
                                   # deliberately generous for the same reasoning-token reason.
  price_per_unit:                  # ESTIMATOR INPUTS ONLY - never billing-authoritative.
                                   # These belong to the models named above; a swap leaves them
                                   # untouched and the pre-flight prints which model each price is
                                   # assumed for (FR-282). Unset/zero prints as "unpriced".
    llm:                           # per-million-token rates (OpenRouter price page, 2026-08-09)
      sonnet: { input_per_mtok: 2.00, output_per_mtok: 10.00 }
      luna:   { input_per_mtok: 0.10, output_per_mtok: 0.60, reasoning_per_mtok: 0.60 }
    image: { 1k: 0.03, 2k: 0.05, 4k: 0.08 }    # three tiers per FR-258; measured exactly in
                                   # spikes/RESULTS.md §B (6 / 10 / 16 credits at $0.005/credit).
    reel_second:
      # ---------------------------------------------------------------------------------------
      # UNSET ON PURPOSE (OQ-2, FR-131/FR-258). Reels are simply not planned until a real number
      # is typed in - the engine refuses to guess with your money. This is the shipped first-run
      # state, not a fault, and it is why formats.reel is 0 above.
      #
      # OQ-2 IS MEASURED (spikes/RESULTS.md §C). Kie bills Seedance 2.5 as
      #     Price x Output seconds                     when no video reference is attached
      #     Price x (Input + Output) seconds           when one is - the reference is BILLED too
      #     720p: 63 credits/s with none  |  38 credits/s WITH a video ref   ($0.005 per credit)
      #     480p: 28 credits/s with none  |  17 credits/s WITH a video ref
      #
      # POST-PIVOT ONLY THE FIRST LINE CAN HAPPEN (v2.0.0, D44): the yt-dlp motion reference is
      # withdrawn, so a reel is a seed frame plus Seedance with nothing else attached. That makes
      # the flat per-second scalar this key has always been an HONEST number again, rather than
      # the worst-case-with-reference derivation FR-258 needed while a reference's own duration
      # was unknowable at estimate time:
      #     720p: 63 x $0.005 = 0.315 per output second  ($1.575 per 5 s reel)
      #     480p: 28 x $0.005 = 0.140 per output second  ($0.700 per 5 s reel)
      # Type those two numbers in (configs/hypedigitaly.yaml already ships them, worked through
      # inline) and raise formats.reel. Understating is the one unacceptable estimator error
      # (D11/FR-282), so re-check the rates against Kie's price page before trusting them with a
      # spend cap. The keys stay unset HERE so a fresh checkout ships with reels unplanned.
      # ---------------------------------------------------------------------------------------
      480p: null
      720p: null
  image_job_timeout_s: 600         # 600 since v2.1.3/D48 (was 300, was 180). Measured image
                                   # renders run ~90 s, but run 20260813_143420_oyo4 lost 11 of 30
                                   # image jobs at the 180 s ceiling under a full-deck carousel
                                   # batch and 300 s did not clear the tail: Kie queues behind
                                   # `max_inflight_render_jobs`, so a slide's wall clock includes
                                   # queue time, not just its own render. A timed-out image job is
                                   # PAID, and since D48 it earns exactly ONE automatic resubmit
                                   # (FR-317) - a second timeout is final and the slide is lost.
                                   # Worst case per render wave is therefore two timeouts, which
                                   # the pre-flight throughput warning now projects against
                                   # run_deadline_min. Video jobs are never resubmitted (FR-44).
  video_job_timeout_s: 1800        # 30 min (operator decision 2026-08-10, was 600). At the W6
                                   # acceptance run a Seedance reel hit the 600 s ceiling and was
                                   # declared failed, wasting ~$4.78: a timed-out job is paid and
                                   # never resubmitted (20 §8), so a tight ceiling buys nothing.
                                   # Live renders measured 302 s and 378 s (spikes/RESULTS.md §C);
                                   # 1800 s is headroom for a slow one, not an expected wait.
                                   # PAIR WITH run_deadline_min above - at 60 min the deadline
                                   # outlives this 30-min ceiling with the earlier stages and the
                                   # gauntlet rounds counted (the engine warns when reels are on).
  poll_interval_s: 3               # gap between Kie recordInfo polls
  http_max_attempts: 3             # EVERY bounded-retry path: OpenRouter, Kie, Virlo, Postiz
  max_inflight_llm_calls: 8        # keep at or under your provider account's concurrency limit
  max_inflight_render_jobs: 8

mcp_servers:
  # NO SECRETS HERE, IN ANY FORM. The engine builds each server's env dict from .env at spawn time,
  # and config loading has no ${VAR} interpolation - a placeholder would stay a literal string
  # (and is rejected outright). Entries name environment VARIABLES, never values (FR-130/D30).
  mcp_startup_timeout_s: 20        # how long a spawned server has to become usable
  mcp_call_timeout_s: 30           # ceiling on any single tool call
  virlo:
    transport: stdio
    command: python -m hypesocials.virlo_mcp      # first-party wrapper, same venv, no Node needed
    env_vars: [VIRLO_API_KEY]
  notion:
    transport: stdio
    # run.bat pre-installs the PINNED package into ./node_modules (FR-113), so this resolves
    # locally and never hits the network at run time. Never `npx -y <pkg>` / `<pkg>@latest`.
    command: npx --no-install @notionhq/notion-mcp-server
    env_vars: [NOTION_TOKEN]
  postiz:                          # Phase 2, optional, ops-query only - parsed and unused in MVP
    transport: streamable_http
    url: ""
    auth_env: POSTIZ_API_KEY

# Notion brand context (optional; only fetched when notion_influence is copy or full).
# IDs are grouped by context type (FR-35); an unset type is simply omitted from the block.
notion_pages:
  brand_voice: []
  offers: []
  icp: []
  topics: []

# FR-124: the brand-context block is TRUNCATED to these fixed per-context-type character budgets -
# a plain cut, no summarization model call. Sized so all four together stay well inside the
# analysis/copy token caps above. (Key name added to 30 §2 via the plan §6 D15 amendment.)
notion_char_budgets:
  brand_voice: 2000
  offers: 1500
  icp: 1500
  topics: 1000

briefs_dir: briefs                 # campaign briefs (D26); one folder per run, no collision rules
prompts_dir: null                  # optional: checked BEFORE the global prompts/ folder (FR-174)

output:
  dir: output/
  gallery: { title: "HypeSocials Run" }
  log_verbosity: normal            # normal | verbose (verbose adds full prompts to events.jsonl)
  console_verbosity: normal        # normal | verbose - the CONSOLE tier only (FR-299, or --verbose
                                   # / -v per run). run.log and events.jsonl are unaffected: audit
                                   # and analytics never depend on what the operator chose to
                                   # watch. verbose adds every filter verdict, all posts of all
                                   # topics, per-upload style-file lines, job ids and heartbeats.

# Phase 2 publishing pointer (FR-176) - present, parsed, and completely unused in the MVP.
# Authoritative shape: prds/60-publishing-postiz.md §6. Distinct from mcp_servers.postiz above,
# which is connection config; this block is publish BEHAVIOUR config.
postiz:
  base_url_env: POSTIZ_BASE_URL    # variable NAME only, like everything else here
  api_key_env: POSTIZ_API_KEY
  default_post_type: draft         # draft | schedule
  auto_publish: false              # the operator approves in the Postiz UI unless turned on
  channel_map: {}
  schedule_slots: {}
