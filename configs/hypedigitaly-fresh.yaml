# HypeDigitaly - AI-agency marketing niche (EN, LinkedIn-led); the shipped default selection
# See prds/30-configuration-and-run.md Â§2 for the full field reference

# A niche is an ordinary config file (D27, v1.6.1): this `niche:` block plus the two ordinary path
# keys below (briefs_dir, prompts_dir) IS the whole mechanism. Picking this file is switching the
# niche. Only overrides appear below - every key not listed here inherits its documented default
# from Â§2, not from default.yaml - with one deliberate exception: the `branding:` block spells out
# the compiled default profiles in full, because brand facts an operator cannot see are brand facts
# an operator cannot correct.

# FR-173: the config picker prints this line verbatim. It MUST name the caption language in
# words, because this file and configs/hypedigitaly-cs.yaml differ in exactly one behavioural
# line (`run.languages`) and their `niche:` blocks are otherwise near-identical - a derived
# picker line cannot tell them apart. Budget: <= 55 chars, ASCII only (legacy cp437/cp852
# console), no box drawing, no check marks, no colour.
label: "AI-agency FRESH POOL - 90d window, one-off test"

niche:
  audience: "founders, marketing leads and ops people at SMBs and agencies evaluating AI automation - EN, LinkedIn-led, Instagram/TikTok secondary"
  vibe: "no-fluff practitioner proof: specific numbers, real workflows, contrarian takes on AI hype; we ship the thing, we don't theorise about it"
  visual_world: "dark UI and dashboard screenshots, terminal/automation-graph fragments, one electric accent on near-black, heavy geometric sans headlines, numbered playbook cards, whiteboard-style arrows"

run:
  formats: { image: 0, carousel: 6, reel: 0 }
  # ALL-CAROUSELS since 2026-08-13 (v2.1.0/D46 Â§0.3, operator decision; was 4/2/0). v1 of the
  # slideshow pivot fetches SLIDESHOWS only (sources.include_videos below), and a slideshow is a
  # deck: a carousel is the only format that can quote one panel for panel (FR-304). Raising image
  # or reel here without also setting sources.include_videos: true is REFUSED at load (Â§0.14e).
  # Post-pivot (v2.0.0, D44) a reel is a seed frame plus Seedance with NO video reference, so it
  # bills at the plain no-reference per-second rate set under price_per_unit.reel_second below:
  # ~$1.58 for a 5 s 720p clip, where the withdrawn motion-reference path cost ~$2.85-$4.75.
  # formats.reel still ships 0 as the everyday default - a reel is ~15x an image even now -
  # so enable it per run with --reels N (and video sourcing) when a reel is actually wanted.
  platforms: [linkedin, instagram, tiktok]
  languages: { linkedin: en, instagram: en, tiktok: en }
  # D54 (operator decision 2026-08-20): the decks this config ships COMPRESS their source panels
  # instead of quoting them whole. The ENGINE default is `verbatim` and stays that way (see
  # prds/30-configuration-and-run.md, run keys) - this is an opt-in, pinned here because the styles
  # below are minimal-density: they declare 160-300 character slide budgets, while the measured
  # panels of run 20260820_001158_2ard ran 1,018-1,048 characters onto `anime-noir-statement`'s
  # 180 (5.8x over). Quoting those whole is what put walls of text on frames built for one bold
  # statement. `compress` sends the SAME admitted panels back to the copy model to come out inside
  # min(run.text_budgets.slide, the assigned style's own max_onimage_chars.slide), humanised, still
  # in the source post's own language - the 1:1 panel-to-slide mapping, the deck length and the
  # three drop reasons of FR-304 are untouched, and a failed compress call falls back to today's
  # verbatim mapped deck tagged `copy_degraded`. Carousels only. `--copy-mode verbatim` reverts it
  # for one run when a deck should quote and nothing else.
  carousel_copy_mode: compress
  # 45 min (operator decision 2026-08-10, default is 25). This is a REEL-CAPABLE config, so the
  # deadline MUST exceed models.video_job_timeout_s (1800 s = 30 min) plus the topic-filter, copy
  # and image stages that run ahead of it - otherwise the run is abandoned before a slow reel can
  # reach its own timeout and the 30 min ceiling is decorative. Still a soft ceiling on the
  # monotonic clock (FR-108).
  # v2.2.0/D49: 45 -> 60. The gauntlet adds up to rounds_max-1 further render waves after
  # the FR-317 worst case, and 60 min is what holds all of it (see configs/default.yaml).
  run_deadline_min: 60
  # Re-enabled 2026-08-20: Sessions 5.5-5.8 fixed the SESSION 5 findings F1-F9 (four live
  # canaries; record in plans/carousel-gauntlet/SESSION-5-LIVE-ACCEPTANCE.md and the four
  # SESSION-5.x closeouts). Operator decision on the residual F10 (render-model reliability):
  # fail_action degrade - contract defects ship TAGGED for gallery review, leakage still blocks.
  gauntlet:
    enabled: true
    fail_action: degrade
  trend_history_days: 90   # FR-307 invariant: must be >= sources.max_post_age_days (90 below)

sources:
  # ONE monitor by operator decision (2026-08-11). GET /v1/agents returns three ids for this key,
  # but only this one was created in Virlo's web app (source: web_app, team_id: null) and so is the
  # only one the operator can see and manage on the Agents page. The other two were created through
  # the API on 2026-08-06/07 into team 5b21bafd-...: "AI Trends Tracker v2" (the only id with
  # data_intelligence_enabled) and "CZ coverage probe", a ONE-SHOT whose next_run_at is null and
  # whose last collection was 2026-08-06 - it can never return anything newer. Dropping both trades
  # the richer intelligence payload for a source the operator actually controls. Restore them by
  # running `run.bat --list-monitors`, which still prints all three.
  virlo_monitor_ids:
    - "9c96fddf-dc35-4be0-bbd9-12f4d22aea12"   # AI Trends Tracker - weekly, analysis_data populated
  # How many TOPICS this one monitor may contribute (FR-293/FR-170, 30 Â§2 Sources). Post-pivot
  # Virlo is a TEXT-ONLY feed: one monitor's analysis is split into several themes, each becoming
  # its own topic with its own view-ranked posts and its own strength. 9 is the default and, with a
  # single monitor configured above, it IS this run's whole candidate pool - lower it only to make
  # the pool tighter, never to save money (collection is one call either way). `-1` is the kill
  # switch: one topic per monitor, i.e. the pre-pivot cardinality. `0` is a config error, not a
  # setting - a monitor that contributes nothing should be removed from the list instead.
  virlo_topics_per_monitor: 9
  # The v2.1.0 fetch window (D46/FR-301). Spelled out here rather than inherited because these four
  # keys decide WHICH posts a paid run may quote, and this is the file that actually runs.
  # false = the fetch gate skips Virlo's video rows and yields slideshows only; a slideshow is a
  # deck, which is what a carousel reproduces panel for panel (FR-304). It also gates run.formats
  # image/reel counts above (Â§0.14e).
  include_videos: false
  # Result pages per monitor at `created_at desc` - ~100 posts a page, so 3 is roughly this
  # monitor's last week. Bounds 1-10, REFUSED out of range rather than clamped (FR-285).
  fetch_pages: 7
  # Posts older than this are dropped pre-rank as stale (publish_date). The run this file produced
  # on 2026-08-13 quoted posts from 2023 because ranking was views-over-all-time; this is the cap
  # that ends that. Must be <= run.trend_history_days (30 by default) or the load is refused
  # (FR-307) - a post must not fall out of the no-repeat memory while it is still being fetched.
  max_post_age_days: 90
  # After the Confirm gate, download the assigned carousel source posts' slides and have the
  # analysis model transcribe their on-image text and describe their visuals (FR-306), so our
  # slides reproduce the CONTENT in our own style. Paid LLM spend, estimated before Confirm.
  # `false` relies on Virlo's own panel_texts alone, which many fresh rows leave empty.
  vision_transcribe: true

# Style selection (v2.1.2/FR-314/D-E): which of the authored meta-styles this config's runs may
# rotate over. A SELECTOR only - prompts/styles.yaml (FR-290) still owns every render prompt,
# palette and layout zone, and nothing written here carries style content. RE-BASED 2026-08-20
# (v2.4.0/D57, operator decision; this was D55's four-key list until the same day): these twelve
# keys are the look this niche doubles down on, and every other style the registry offers is out
# of the rotation until this list changes. The unifying teal spine is curated BY THIS LIST: the
# `-teal` entries are their own registry entries, copied from the originals and re-roled onto the
# house teals, and the originals they came from are untouched - which is D-G honoured exactly as
# written (colour is curated by CHOOSING styles, never by editing a style, because an edit would
# change every later run too). A key the registry does not define, or a selection that leaves a
# requested format with no affine style under the brand, refuses at pre-flight: exit 2, $0 spent,
# and the message names what the registry really offers. Pass `run.bat --styles key1,key2` to
# narrow it further for one run.
# (The old `styles.refs_per_job` window is still gone - D46/F3, a text-only style ships no
# reference images - and this key is not its return.)
styles:
  # Listed in reading order, which is NOT the order they are drawn in: both FR-291's rotation and
  # FR-334's matcher walk the pool in prompts/styles.yaml FILE order, so how this list is typed
  # changes nothing but how this block reads.
  enabled: [anime-noir-statement, platform-showcase-card, letterpress-print-carousel-teal,
            meme-caricature-panels-teal, quiet-luxury-night-photoreal-teal,
            photoreal-ambient-caption-teal, ugc-tabletop-statement-teal, build-log-mono,
            icon-ledger-carousel, circuit-atlas-dark, social-quote-card, terminal-mockup-deck]
  # meme-caricature-panels-teal inherits `carousel_role: slides_only` from the entry it was copied
  # from - inert while this config runs carousels only (operator: keep for now; activates if image
  # posts return). Same ruling D55 made for the un-tinted key, kept deliberately for the same
  # reason: an inert key costs nothing, because fmt_affine drops it per format.
  # hypelead-brand-card deliberately absent: branding.enabled is false here (brand_ok drops
  # it anyway); branded entries sign through the TEXT block on any style (FR-318/FR-292).
  # v2.4.0/FR-334 (D56): WHICH ALGORITHM assigns a style to a creative - not to be confused with
  # the neighbouring `styles.rotation` key (`seeded | fixed`, engine default `seeded`, left unset
  # in this file), which only decides where the deterministic scan STARTS. `matched` runs ONE
  # batched, fail-open LLM screen at ASSIGN (the `analysis` role, quoted at the Confirm gate as
  # `style_match_call`) that reads each creative's own source signals and picks the best-fitting
  # style out of the enabled pool above. It never replaces the deterministic rotation, it
  # OVERLAYS it: FR-291's pick is computed first and is what an entry keeps when the matcher
  # answers `low` fit, names a style outside that entry's pool or skips the row, and what the
  # WHOLE plan keeps when the call itself fails - tagged `style_match_degraded`, run continues.
  # Twelve enabled styles under plain rotation would be visual chaos, so the pool above and this
  # key are ONE decision: `assignment: rotation` restores pre-D56 behaviour byte-exactly (and
  # still obeys `styles.rotation: seeded|fixed`), and narrowing the list again is what should
  # come with it.
  assignment: matched

# Brand identity for this config (FR-292/D43) - which brand the run signs with, how often, and in
# what shape. Only the branded fraction below carries the wordmark. The wordmark itself is NOT
# composited: it is quoted into the render prompt's TEXT block, so it is spelled by the same
# mechanism as every other rendered string. Everything else here (accent colours, font character,
# placement, background hint, the `never:` guards) reaches the prompt through the branding block,
# ranked BELOW the assigned meta-style - branding tints and signs a style, it never replaces one.
branding:
  # SELECTOR, never a mix (operator decision 6, 2026-08-12): one run is one brand. It also filters
  # the style rotation - a style whose `brand_affinity` names the other brand is simply not
  # assignable here (B3). `hypelead` is the product brand and owns the house SOCIAL-POST kit the
  # registry's brand-card style is built from; switch to `hypedigitaly` for parent/corporate posts
  # (indigo->teal, Montserrat) and the brand-card style drops out of the rotation on its own.
  brand: hypelead
  # Fraction of the emitted plan that carries the wordmark, applied as a deterministic floor
  # predicate on entry.order (FR-291), so `floor(N x ratio)` creatives are signed and the choice is
  # stable across re-runs and unaffected by a later trim. 0.5 = half the batch signed, half clean:
  # a feed where every post is signed reads as a watermark, and one where none is reads as nobody's.
  brand_ratio: 0.5
  # background_tint | overlay | both. `overlay` keeps the meta-style's own ground intact and adds
  # the accent + signature on top; `background_tint` also hands the model the profile's
  # `background_hint` below, which is a much stronger visual claim on the frame.
  mode: overlay
  placement: bottom-center         # wordmark placement hint, honoured through the TEXT block entry
  # Layer 1 of the competitor filter (FR-294) and the only DETERMINISTIC one: these strings are
  # matched in code, before and independently of the LLM screen, and they stay enforced when that
  # screen degrades. Fail-closed on purpose - "the model was unavailable" must never be the reason
  # a competitor's name ships inside our pixels. Add rivals you never want rendered or captioned;
  # our own product_nouns below are protected from being stripped as if they were competitors.
  competitors: []
  # The two house brand systems, spelled out so they are visible and editable here rather than only
  # in code. These values ARE the engine's compiled defaults (config.py `_default_profiles`), with
  # one deliberate exception noted at hypelead.background_hint. Override any single key - the
  # loader merges key by key, so touching one colour keeps the rest of the profile intact.
  profiles:
    hypedigitaly:                  # parent / corporate: indigo->teal gradient, Montserrat
      wordmark: "HypeDigitaly"     # CamelCase, no space; rendered one weight, one colour
      colors:
        indigo: "#34288B"
        teal: "#00A59A"
        gradient: ["#34288B", "#2B3F8E", "#0C8897", "#00A59A"]   # indigo -> blue -> teal, L to R
      fonts: { brand: "Montserrat", web: "Geist" }
      # A render model cannot install a font, so the font is described, not named at it (F21).
      font_character: "Montserrat â€” geometric grotesque, near-circular bowls, medium x-height, uniform stroke"
      background_hint: "flat royal-indigo field, gradient arrow glyphs sweeping the right half, vast negative space"
      # COLOUR guards - injected into EVERY branded prompt under this brand, whatever style was
      # assigned. Orange #F97316 is a website-only accent and appears in no brand asset, so it is
      # in neither profile's colours and is named here to keep it out of the pixels.
      never_always: ["no teal pill highlights", "no dot-grid ground", "no orange #F97316 (web-only)"]
      # MEDIUM guards - injected ONLY when the assigned style is affine to this brand. Empty here:
      # the corporate system has no medium of its own to defend.
      never_style: []
      # Our own product names: the copy may use them, and the topic filter must never "strip a
      # competitor brand" that is one of these (M15).
      product_nouns: ["AI Audit", "HypeLead", "AI Chatbot", "AI Voicebot", "AI Agent", "AI Automatizace"]
    hypelead:                      # product: teal-only, Geist, pill grammar - never mixed with the above
      wordmark: "HypeLead"
      colors:
        teal_bright: "#0FCFC4"
        teal_mid: "#57E6DC"
        teal_deep: "#0A7F78"
        teal_light: "#8BF2E9"
        dark: "#14130F"            # reads as charcoal-GREEN under teal glow, not neutral black
        offwhite: "#FAFAF7"
      fonts: { primary: "Geist", mono: "Geist Mono" }
      font_character: "Geist â€” clean grotesque, tight tracking, even color"
      # ONE resolved variant on purpose (conductor decision, 2026-08-12 / M9): the brand kit also
      # has a charcoal-green dark mode, but a hint that offers the model a choice is a hint that
      # makes two different-looking posts from one setting. Swap the whole string for
      # "charcoal-green ground with vignette and teal glow" to run the dark mode instead.
      background_hint: "off-white ground with faint dot-grid and soft teal bloom"
      never_always: ["no indigo or violet", "no orange #F97316"]
      # Medium guards, brand-affine styles only: six of the seven neutral styles are legitimately
      # photographic or hand-drawn, so applying these everywhere would quietly ban most of the
      # registry the moment a creative got a wordmark (M6).
      never_style: ["no photography/stock/3D", "no serif or handwritten type", "teal is accent only, never full-bleed canvas"]
      product_nouns: ["HypeLead"]

# Niche asset paths (D27). A missing folder is not an error - the contribution is simply absent
# for that run, logged once at info level (30 Â§8).
briefs_dir: niches/hypedigitaly/briefs   # holds ai-audit-cta/ (shipped first brief, W5 T5.3)
prompts_dir: null                        # set to niches/hypedigitaly/prompts once that folder exists

models:
  # 30 min (operator decision 2026-08-10, was 600). The W6 acceptance run declared a Seedance reel
  # failed at the 600 s ceiling and wasted ~$4.78 - a timed-out job is paid and never resubmitted
  # (20 Â§8), so the ceiling only ever discards work already bought. Measured renders took 302 s
  # and 378 s; 1800 is headroom for the slow tail. Needs run_deadline_min: 60 above to be reachable.
  video_job_timeout_s: 1800

  price_per_unit:
    reel_second:
      # ---------------------------------------------------------------------------------------
      # MEASURED NO-REFERENCE reel pricing for THIS config's reel shape (30 Â§2 price block,
      # FR-131/FR-258, amended v2.0.0). The estimator multiplies the scalar for the configured
      # run.reel_resolution by run.reel_duration_s; an unset scalar means reels are not planned
      # at all rather than guessed at (FR-131).
      #
      # Kie's published Seedance 2.5 formula (spikes/RESULTS.md Â§C, confirmed to the credit):
      #     no video reference   ->  cost = unit x  output_s
      #     with video reference ->  cost = unit x (input_s + output_s)      <- the ref is BILLED
      #     720p: 63 credits/s without a video ref | 38 with   ($0.005 per credit)
      #     480p: 28 credits/s without a video ref | 17 with
      #
      # POST-PIVOT THE SECOND BRANCH IS UNREACHABLE (v2.0.0, D44): the yt-dlp motion reference is
      # withdrawn, a reel is a seed frame plus Seedance and NOTHING else is attached, so every
      # reel this tool can submit bills on the no-reference line. The old worst-case-with-reference
      # scalars (0.950/0.425, derived from a 20 s reference bound that no longer exists) overstated
      # a real reel by ~3x and are gone with it - overstating is safe for the spend cap but it
      # silently trims creatives out of a plan that would have fitted.
      #     720p: 63 credits/s x $0.005 = 0.315 per output second  ($1.575 per 5 s reel)
      #     480p: 28 credits/s x $0.005 = 0.140 per output second  ($0.700 per 5 s reel)
      #
      # These are per-SECOND rates, so changing run.reel_duration_s needs no recomputation here -
      # only a Kie price change or a model-family swap does (a swap never rewrites them: FR-282,
      # and the pre-flight prints which model each price is assumed for).
      # ---------------------------------------------------------------------------------------
      480p: 0.140
      720p: 0.315


