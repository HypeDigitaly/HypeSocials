# prompts/styles.yaml — the meta-style registry (FR-290/291, plan §1.3, D46 §0.5/F3).
#
# This file is the VISUAL AUTHORITY of the whole product. Eight textual style definitions,
# deterministically rotated across the creatives of a run.
#
# **Text-only, since D46 (v2.1.0).** No style reference picture is ever attached to a render job:
# the only images a job may carry are a campaign brief's own product photos, the finished carousel
# anchor slide, and a reel's seed frame. Everything a style IS therefore has to be readable here,
# in words, by a model that has never seen a single example of it. Write for that reader.
#
# Unlike the templates in this folder, the registry has NO built-in fallback tier: a missing,
# unreadable or invalid `styles.yaml` is a pre-flight refusal (FR-295, exit 2), never a silent
# degradation. A built-in copy would be eight styles of invisible drift.
#
# Editing rules
#   - `render_prompt` stays at or under 120 words and carries NO unresolved variant ("either
#     A or B", "Variant A/B", "teal or cobalt"). Resolve the choice here, once; a render model
#     handed a choice makes a different one every time. Pre-flight warns on the three spellings.
#   - `render_prompt` plus the five DNA fields (`palette`, `typography`, `text_placement`,
#     `image_treatment`, `visual_pacing`) are the WHOLE look. Name hexes, name letterform
#     character, name the light, name what the surface is made of. "Like the reference" is not a
#     sentence any of these fields may contain any more — there is no reference.
#   - Cover-versus-body divergence lives in `per_format_guidance`, never in `render_prompt` —
#     `style_dna` must stay byte-identical across every slide of one deck. The two reserved keys
#     `carousel_cover` and `carousel_slide` are APPENDED to `render_prompt` for slide 1 and for
#     slides 2–N respectively, so they are prompt text and must read as instructions.
#   - `carousel_role: slides_only` removes the style from carousel assignment entirely (under
#     anchor chaining slide 1 IS the deck's style). `cover_only` is a note to the author; such a
#     style still takes whole decks, so it still needs a `carousel_slide` paragraph.
#   - `exclusions` are SELF-CONTAINED forbid-rules, readable without any picture: platform chrome,
#     watermarks, real company/product logos, real account names, faces, legible text outside the
#     declared zones. They never restrict the TEXT block: a wordmark quoted in the TEXT block is
#     always rendered, even when a similar word appears in the exclusions below (the render
#     templates state this in one line of their own).
#   - `max_onimage_chars` is this style's own ceiling per text kind. The EFFECTIVE limit is
#     `min(config text_budgets, this cap)` — config ships headline 90, subline 160, slide 300,
#     reel seed hook 60 (FR-259), so a cap lower than those is what actually binds, and the raised
#     budgets of D46 §0.5 only reach the model through the numbers below. The copy stage offers
#     only source strings that already fit, so a low number here means a shorter quoted line —
#     never a truncated one, and on a panel-mapped deck (FR-304) a panel that does not fit leaves
#     that slide WORDLESS. Keys: `headline`, `subline`, `slide`, `overlay` (the reel seed hook,
#     which also obeys `headline` when this style names one).
#   - A missing key, and a `0`, both mean "this style states no ceiling of its own" — the config
#     budget then applies in full. Neither one suppresses a text kind; write a real number.
#   - `brand_affinity: []` (or omitted) = brand-neutral, usable under every brand.
#     `brand_slot: true` = this style IS a brand's own house style; the branding block
#     collapses to nothing extra for it and only the TEXT-block wordmark remains.

version: 1

styles:

  - key: photoreal-ambient-caption
    render_prompt: >-
      Candid smartphone-grade photograph of a lived-in interior, shot at human eye level, close
      enough to feel present; the environment carries the message. Bright diffuse window daylight
      on pale walls, long soft shadows, no added fill light. The palette comes from the room
      itself: off-white plaster, warm grey, pale oak, one warm accent object. No graphic
      furniture — no frames, stickers, badges, icons, arrows, gradients. Anyone in frame stays
      anonymous: back turned, silhouetted, cropped away at the edge. Quoted text sets in a
      regular-to-semibold neutral grotesque sans, sentence case, white, over low-detail negative
      space; a long string breaks into as many as five tight lines on a soft charcoal plate at
      low opacity. Mood: quiet, aspirational, diaristic, unstaged.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "upper-left third, over an empty wall or an unbroken surface",
         content: headline,
         text_treatment: "regular-to-semibold neutral grotesque sans, sentence case, white with a faint drop shadow, up to five tight lines, always over low-detail negative space and never over the subject"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: moderate
    max_onimage_chars: {headline: 90, subline: 120, slide: 240, overlay: 60}
    motion_profile: photographic
    palette: ["off-white plaster #EDEAE4", "warm grey #B7B2AA", "pale oak #C2A278", "near-black shadow #14120F", "caption white #FFFFFF"]
    typography: "one neutral grotesque sans only (Inter, Helvetica Now, or the same species), regular to semibold, sentence case, normal tracking, generous line spacing; no second family, no display face, no script, no all-caps"
    text_placement: "a single caption block in the upper-left third over low-detail negative space; clear of the subject and of every edge; short strings float with a faint drop shadow, longer strings sit on a soft charcoal plate at roughly a quarter opacity with rounded corners and wide inner padding"
    image_treatment: "candid available-light photograph with natural sensor grain and honest lens character — mild vignetting, gentle highlight roll-off, real depth of field; no graphic overlay, no sticker, no frame, no colour grade that departs from the room, no studio lighting, no styled flat lay"
    visual_pacing: "one idea per frame; the room does the talking and the caption only names it — never more than one text block, never a second focal object"
    per_format_guidance:
      carousel_cover: "Cover: the widest view of the room, establishing the space; the quoted text sits high-left over the emptiest wall at the largest size it will hold."
      carousel_slide: "Body slide: move closer into the SAME space — one prop, one surface, one corner, same light direction, same palette, same caption treatment as the cover. A long quoted panel sets on the charcoal plate at reading size rather than shrinking the type past legibility."
    exclusions:
      - "platform UI of any kind: player chrome, progress bars, play buttons, pagination dots, search fields, tab bars, share and like icons"
      - "watermarks, app badges, usernames, @handles, profile pictures, follower, like, view or comment counters"
      - "manufacturer logos and brand marks on visible hardware, appliances, packaging, clothing or stationery — every object in frame is unbranded"
      - "identifiable faces: a person in frame is turned away, silhouetted, or cropped at the edge"
      - "legible text anywhere outside the caption zone — signage, screen copy, book spines, printed matter and handwriting stay soft, out of focus or illegible"
      - "graphic furniture: stickers, badges, chips, sparkles, drawn arrows, frames, borders, gradient meshes, lens flares"

  - key: editorial-voxel-carousel
    render_prompt: >-
      Magazine-cover slide on a flat warm-cream field. The headline is a high-contrast Didone
      serif at very large size, stacked in two to three lines, near-black with one saturated teal
      phrase; a small tracked-out uppercase sans kicker sits directly above it and a thin teal
      double rule underneath. A longer quoted string continues under that rule as a left-aligned
      deck of short serif lines, never as a grey paragraph. The hero object fills the lower half:
      one physically rendered voxel toy figure, matte moulded surface, lit like studio product
      photography, casting soft contact shadows on the cream. Hand-drawn teal accents:
      four-point sparkles, motion ticks, one script annotation with an arrow. Supporting
      graphics: an icon-and-label list column, a dark terminal-window card.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left corner", content: "slide-position badge",
         text_treatment: "outlined rounded-rectangle chip, small bold sans; carries the slide position and nothing else"}
      - {position: "upper 40 percent, full width, kicker directly above the headline",
         content: headline,
         text_treatment: "tracked-out uppercase sans kicker over a Didone serif headline in two or three lines, near-black with one saturated teal phrase, thin teal double rule beneath"}
      - {position: "left column of the middle band, or one annotation line under the headline",
         content: body,
         text_treatment: "icon-and-label rows in medium sans, or a single handwritten-script line in teal with a drawn arrow"}
      - {position: "top-right corner", content: "swipe cue",
         text_treatment: "hand-drawn teal arrow glyph only — a mark, never a lettered word, unless a swipe string is quoted in the TEXT block"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 110, subline: 160, slide: 300}
    motion_profile: graphic
    palette: ["warm cream ground #F6F0E4", "near-black #14120F", "teal accent #0C8897", "paper shadow grey #CFC7B8", "white card #FFFFFF"]
    typography: "high-contrast Didone serif for the headline (large, tightly leaded, hairline-to-heavy stroke contrast), tracked-out uppercase grotesque sans for kickers, chips and labels, one handwritten script reserved for annotations; three families, never a fourth"
    text_placement: "kicker and headline stack in the upper 40 percent with the teal double rule closing them; a long quoted string continues directly beneath that rule as short left-aligned lines; supporting labels run down the left column; corner chips top-left and top-right; the hero object owns the lower half"
    image_treatment: "physically rendered voxel and glossy 3D props photographed as studio product shots — matte moulded surfaces, soft contact shadows, gentle specular highlights — floating on a flat cream field with no environment behind them; hand-drawn ink accents in the accent colour; no photography of real places, no gradient background"
    visual_pacing: "loud headline, quiet ground, one hero object; every slide repeats the same three-part rhythm of kicker, headline, object, so the deck reads as one magazine"
    per_format_guidance:
      carousel_cover: "Cover: the full stacked headline with the teal payoff phrase at maximum scale, the largest hero object, badge reading position 1."
      carousel_slide: "Body slide: drop the headline by roughly a third, keep the kicker and the teal rule, and give the freed middle band to the quoted line, the icon-and-label list, or the terminal card. Same cream ground, same rule weight, same corner chips as the cover."
    exclusions:
      - "platform UI and overlays: pagination dots, search fields, play triangles, tab bars, share sheets, 'related content' banners"
      - "watermarks, app badges, usernames, @handles, follower, like or view counters"
      - "real company, product or app logos — list rows, chips and icon nodes carry invented abstract glyphs only, and a made-up brand name in their place is equally forbidden"
      - "legible text inside a screenshot, terminal card, phone or device screen: interface copy is greeked into grey bars unless it is quoted in the TEXT block"
      - "lettered navigation cues — the top-right swipe mark is a drawn arrow glyph and carries no words"
      - "photographic environments, gradient meshes, lens flares, drop-shadowed glass panels: the ground is a flat cream field and stays flat"

  - key: letterpress-print-carousel
    render_prompt: >-
      Risograph and letterpress poster grammar: one paper tone plus exactly two ink colours, with
      visible paper grain, distressed ink texture inside the letterforms and slight
      misregistration at the edges of solids. Type does the work — a towering display face set
      tight and huge, with one phrase set apart in the second ink; a longer quoted string runs
      underneath in a lighter weight of the same family, left-aligned, up to six lines with
      generous leading. Hand-drawn marker underlines, circled cues and one small pixel-art mascot
      sit in the accent ink. Any screenshot inset rides on a white card held by translucent tape
      strips and shows invented, wordless interface. Nothing glossy, nothing gradient, nothing
      photographic. High text tolerance.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left corner", content: "slide-position badge",
         text_treatment: "outlined rounded-rectangle chip in the accent ink, small tracked caps; the slide position only"}
      - {position: "top two-thirds on the cover, upper-left third with a generous margin on a body slide",
         content: headline,
         text_treatment: "towering display type set tight, one ink for the setup lines and the second ink (or a reversed black bar) for the payoff phrase"}
      - {position: "middle band, left-aligned", content: body,
         text_treatment: "lighter weight of the headline family, two to six lines, generous leading, one hand-drawn marker underline allowed"}
      - {position: "lower-right, or top-right on a body slide", content: "swipe cue",
         text_treatment: "hand-drawn circled arrow in the accent ink — a drawn mark, never a lettered word, unless a swipe string is quoted in the TEXT block"}
    format_affinity: [carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 110, subline: 160, slide: 300}
    motion_profile: graphic
    palette: ["aged cream paper #E8DCC3", "terracotta ground #B5573C", "black ink #1A1714", "vermilion ink #E2522B", "cream ink #F3E9D8"]
    typography: "condensed woodtype-style uppercase display for covers, ultra-heavy geometric lowercase sans for body slides, one lighter weight of that same sans for paragraphs, hand-drawn marker for annotations; letterforms carry ink texture and slightly ragged edges, never clean vector outlines"
    text_placement: "the headline owns the top two-thirds of a cover and the upper-left third of a body slide; the quoted paragraph fills the middle band, left-aligned, ragged right; position chip top-left, drawn cue in the opposite corner; wide paper margins on every side"
    image_treatment: "flat printed inks on textured paper — visible tooth, grain, slight plate misregistration, ink density variation inside solids; a pixel-art mascot is the only illustration; screenshot insets are taped onto white cards and never bleed to the edge; no photograph, no gradient, no gloss, no drop shadow"
    visual_pacing: "one enormous typographic statement per slide, one supporting paragraph, one drawn mark — the paper is the ground and never a photograph"
    per_format_guidance:
      carousel_cover: "Cover: aged cream paper with visible grain. The headline is towering condensed woodtype-style uppercase filling two thirds of the frame — black ink for the setup lines, vermilion for the payoff line, distressed ink texture inside every letterform. Hand-circled cue lower-right, outlined position chip top-left."
      carousel_slide: "Body slide: saturated terracotta ground with film grain. The headline is lowercase ultra-heavy geometric sans in cream with one phrase reversed inside a solid black highlight bar; a longer quoted string sets beneath it in the lighter cream weight across the middle band. Insets ride on a taped white card. Position chip top-left in mono caps."
    exclusions:
      - "platform UI and overlays: pagination dots, search fields, play triangles, player chrome, 'related content' banners"
      - "watermarks, app badges, usernames, @handles, real account names or author credits printed as a rule or footer"
      - "real company, product or app logos and any invented substitute for one; marks in this style are drawn shapes without letters"
      - "legible text inside a taped screenshot card, a mock website or a device screen — that interface is invented and either wordless or greeked"
      - "lettered navigation cues: the swipe mark is a hand-drawn circled arrow and carries no words"
      - "photographic imagery, glossy surfaces, gradients, soft drop shadows, 3D renders — every mark on the page is printed ink"

  - key: meme-caricature-panels
    render_prompt: >-
      Two stacked comic panels of equal height with thin black frames on a warm paper ground,
      built as a before-and-after contrast: the top panel is chaotic and overloaded, the bottom
      panel calm and smug. The technique is ink-outline caricature with gouache and watercolour
      shading; exaggerated posture and clutter carry the joke. Warm tungsten light
      and a sepia-leaning palette in the top panel; one saturated violet-blue character is the
      focal note in the bottom panel. Each panel is captioned by a heavy condensed sans line in
      black, sentence case with a terminal period, set on the paper margin above the artwork and
      never inside it — one line per panel, two when the string is long. Energy: dry, deadpan,
      shareable.
    subject_mode: scene_open
    layout_zones:
      - {position: "paper margin above each of the two panels, centred", content: headline,
         text_treatment: "heavy condensed sans in black, sentence case with a terminal period, one line per panel (two when the string is long), never overlapping the artwork"}
      - {position: "bottom paper margin, centred", content: "signature line", role: brand_slot,
         text_treatment: "tiny letterspaced uppercase sans in warm grey, one line, well clear of the lower panel frame"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 60, subline: 60, slide: 60, overlay: 60}
    motion_profile: graphic
    palette: ["warm paper #EFE6D2", "ink black #1B1815", "sepia shadow #8A6A46", "tungsten glow #E9B36A", "violet-blue focal #4A3FA8"]
    typography: "one heavy condensed sans for the panel captions, sentence case with terminal periods, tight tracking; a tiny letterspaced uppercase cut for the footer line; no third family, no script, no serif"
    text_placement: "captions live in the paper margin ABOVE each panel, centred and clear of the frame rule; the artwork itself carries no lettering at all; the footer line sits alone in the bottom margin"
    image_treatment: "ink-outline caricature with gouache and watercolour shading and visible paper tooth — confident varying line weight, flat washes, no digital gradient; warm tungsten lighting, clutter and paperwork in the top panel, clean empty space in the bottom"
    visual_pacing: "two beats and a punchline: overloaded above, serene below, one line of copy each — the eye reads caption, picture, caption, picture, and stops"
    per_format_guidance:
      carousel_role: slides_only
      carousel_slide: "Body slide only, never a cover. Each slide is its own complete two-panel joke on the deck's shared paper ground, with the same frame weight, the same margins and the same caption treatment as its neighbours."
    exclusions:
      - "platform UI, watermarks, app badges, usernames, @handles, follower, like or view counters"
      - "manufacturer and company logos on monitors, laptops, mugs, packaging or clothing inside either panel"
      - "the likeness of any real, recognisable person — the characters are invented caricatures"
      - "readable text inside the artwork: sticky notes, papers, whiteboards, screens and signage stay illegible scrawl, because the only words in this frame are the two panel captions"
      - "a third panel, an inset, a speech balloon or a caption box inside the artwork — captions live in the paper margin and nowhere else"

  - key: anime-noir-statement
    render_prompt: >-
      Cinematic anime key visual: a hooded figure seen from behind at a multi-monitor desk, face
      never shown, dwarfed by a rain-streaked window onto a night-city bokeh skyline. Painterly
      cel shading with heavy rim light from the screens, glowing abstract light ribbons on the
      displays, one warm practical lamp against a cool blue-teal night palette; the bottom
      quarter of the frame falls to near-black. Over that dark band sits a display serif
      statement at poster scale, white with exactly one word in saturated teal, tight leading:
      two lines by default, up to four tighter lines at reduced scale when the quoted string is
      long. Below it a thin hairline rule closes the frame. Mood: nocturnal, obsessive, quietly
      triumphant.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "lower third, left-aligned over the darkened foreground band", content: headline,
         text_treatment: "display serif at poster scale, two to four lines, tight leading, white with exactly one word in saturated teal, terminal period"}
      - {position: "very bottom, centred, flanked by hairline rules", content: "signature line",
         role: brand_slot,
         text_treatment: "small letterspaced uppercase sans in teal-tinted white, one line, hairline rule left and right"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 90, subline: 90, slide: 180, overlay: 60}
    motion_profile: photographic
    palette: ["night blue-black #0B1016", "screen teal #17B7B0", "warm lamp amber #E8A64C", "city bokeh white #DCE7F2", "foreground near-black #05070A"]
    typography: "one display serif for the statement — moderate stroke contrast, sharp entry serifs, set tight — white with a single teal word; one small letterspaced uppercase sans for the footer; nothing else, no script, no italic"
    text_placement: "the statement occupies the lower third over the darkest band, left-aligned, never crossing the figure's silhouette; the footer sits at the very bottom between hairline rules; the upper two thirds stay picture"
    image_treatment: "painterly anime cel shading with visible brushwork in the shadows, heavy screen rim light on the figure's edge, rain-streaked glass, deep bokeh city depth, volumetric haze; displays carry abstract light ribbons instead of readable interface; no photograph, no 3D render, no line-art outline look"
    visual_pacing: "one figure, one window, one sentence — the frame darkens downward into the words, and nothing competes with them"
    per_format_guidance:
      carousel_role: cover_only
      carousel_cover: "Cover: the widest night view, the statement in the lower third at full poster scale, the hairline rule closing the frame."
      carousel_slide: "Body slide: the same night, one step closer — a different angle on the same desk, window or skyline under the same rim light and the same palette. The dark lower band, the statement position and the type treatment are identical to the cover; only the picture behind them and the quoted words change. A long quoted panel sets in up to four tighter lines rather than spilling out of the band."
    exclusions:
      - "platform UI, player chrome, progress bars, watermarks, app badges, usernames, @handles, follower or view counters"
      - "readable interface content on the monitors — the screens carry abstract light ribbons only: no windows, no code, no dashboards, no charts, no logos"
      - "any recognisable face: the figure is seen from behind and stays anonymous"
      - "company, product and app logos anywhere in the scene, including on the hardware, the hoodie and the city signage; distant signs stay illegible glow"
      - "legible text outside the statement band and the footer — no titles, no subtitles, no captions burned over the picture"

  - key: ugc-tabletop-statement
    render_prompt: >-
      First-person photorealistic tabletop scene shot from roughly thirty degrees above the
      surface: a worn wood table with everyday work props — a closed laptop, a speckled ceramic
      mug, a paper notebook, a pen — arranged casually, shallow depth of field, a home kitchen
      softly blurred behind. Golden-hour side light with long warm shadows; a palette of honey
      wood, oat, cream and speckled ceramic neutrals. It reads as an unstaged phone photo posted
      by a real person, never as product photography. Quoted text sets in a heavy
      rounded-humanist sans, white, sentence case, tight leading, two to four short lines over
      the defocused upper region, with no backing plate. Mood: relieved, settled, an understated
      brag.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "upper third, left-aligned over the blurred background band", content: headline,
         text_treatment: "heavy rounded-humanist sans in white, sentence case, two to four short lines with tight leading, no backing plate, no outline"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 90, subline: 90, slide: 120, overlay: 60}
    motion_profile: photographic
    palette: ["honey wood #B07C4A", "oat linen #DCCFB8", "cream ceramic #EFE7D8", "warm shadow #4A3624", "text white #FFFFFF"]
    typography: "one heavy rounded-humanist sans in white, sentence case, tight leading, slightly loose word spacing; no second family, no all-caps, no script, no outline and no drop shadow"
    text_placement: "one statement block in the upper third over the defocused background, left-aligned, clear of every prop and every edge; the block never crosses a sharp object and never sits over the table surface"
    image_treatment: "photoreal phone-camera capture — golden-hour side light, shallow depth of field, honest lens softness, mild sensor noise, warm white balance; no studio lighting, no styled flat lay, no colour grade, no added graphic element"
    visual_pacing: "one table, one statement, one warm light — the props are lived-in and never arranged for the camera"
    per_format_guidance:
      carousel_role: slides_only
      carousel_slide: "Body slide only, never a cover. Each slide is a different corner of the same table under the same light: one prop moves, the statement block keeps its position, size and treatment, and a longer quoted string adds lines downward rather than shrinking the type."
    exclusions:
      - "platform UI, watermarks, app badges, usernames, @handles, follower, like or view counters"
      - "manufacturer logos and brand marks on the laptop, the mug, the pen, the notebook or any other prop"
      - "readable handwriting or print on props — writing in the notebook and on any paper stays illegible scrawl"
      - "legible text anywhere outside the statement block, including screens, packaging and signage in the blurred background"
      - "graphic overlays: stickers, badges, chips, arrows, frames, emoji drawn as artwork, gradient scrims"

  - key: platform-showcase-card
    render_prompt: >-
      Flat ecru canvas with generous whitespace and a strict vertical stack: a small tracked-out
      uppercase kicker in teal; an oversized tight-tracking geometric sans headline in near-black
      across two lines with one phrase switched to teal; then a large centred browser-window
      mock-up — rounded corners, three traffic-light dots, pale chrome bar — holding an invented
      interface rendered as a wireframe with greeked grey bars where copy would sit; then the
      quoted explanatory text in a regular sans, two to four centred lines; then a
      hairline-flanked signature slot at the foot. Soft card shadow only, no gradient on the
      canvas, no photography, no 3D. Mood: announcement, product-launch clarity.
    subject_mode: scene_open
    layout_zones:
      - {position: "upper quarter, centred, kicker immediately above the headline",
         content: headline,
         text_treatment: "tracked-out uppercase teal kicker over an oversized tight-tracking geometric sans headline in near-black, two lines, one phrase in teal"}
      - {position: "centre of the frame", content: "browser-window mock-up",
         text_treatment: "no lettering inside the window — greeked grey bars and blocks stand in for every string"}
      - {position: "directly beneath the browser card, centred", content: body,
         text_treatment: "regular sans, two to four lines, near-black at reading size"}
      - {position: "foot of the frame, centred between hairline rules", content: "signature line",
         role: brand_slot,
         text_treatment: "small letterspaced uppercase sans, one line, hairline rule left and right"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 110, subline: 160, slide: 300}
    motion_profile: graphic
    palette: ["ecru canvas #F4EFE2", "near-black #16151A", "teal accent #0C8897", "card white #FFFFFF", "chrome grey #D6D2C8"]
    typography: "one tight-tracking geometric sans across the whole card (Poppins, Gilroy, or the same species): tracked-out uppercase for the kicker and the footer, oversized bold for the headline, regular for the caption; no serif, no script, no second family"
    text_placement: "strict vertical stack — kicker, headline, browser card, the quoted caption in two to four centred lines, signature slot; everything centred on one axis, everything margined generously, nothing touching the canvas edge"
    image_treatment: "flat vector-clean canvas with exactly one soft card shadow; the only depth in the frame is the browser window floating over the ecru; wireframe interface inside it — grey bars, empty blocks, simple outlined shapes; no gradient, no photograph, no 3D render, no glass or glow effect"
    visual_pacing: "announcement rhythm — a whisper, a shout, a demonstration, a footnote — repeated identically on every slide of a deck"
    per_format_guidance:
      carousel_cover: "Cover: the browser card at its largest, the headline at full scale, the signature slot closing the frame."
      carousel_slide: "Body slide: keep the stack and shrink the browser card to make room for the quoted caption, which may run to four lines at reading size. The kicker keeps its size, colour and tracking on every slide; only the words below the card change."
    exclusions:
      - "platform UI outside the mock-up itself: no player chrome, no pagination dots, no search overlay, no share sheet, no tab bar"
      - "watermarks, app badges, usernames, @handles, follower, like or view counters"
      - "real company, product or app logos anywhere in the frame, including inside the browser mock-up and above the headline; an invented brand name in their place is equally forbidden"
      - "legible text inside the browser window — every string in that interface is greeked into grey bars unless it is quoted in the TEXT block"
      - "photography, gradient backgrounds, glassmorphism, neon glow, 3D perspective on the card: the canvas is flat ecru and the card is flat white"

  - key: hypelead-brand-card
    render_prompt: >-
      Minimal premium SaaS brand card. Warm off-white ground (#FAFAF7) carrying a faint dot-grid
      texture and one soft teal radial bloom in a corner. A massive tight-tracked bold grotesque
      headline in near-black, sentence case, two to three lines, with the payoff phrase set
      inside a rounded-rectangle teal gradient highlight pill (#57E6DC to #0FCFC4) in dark-teal
      type with a soft glow. A monospace uppercase letterspaced kicker with a small teal dot sits
      above the headline. White rounded cards with gentle shadows hold checklists, numbered teal
      chips and clean invented interface mock-ups; a longer quoted string sets as card rows.
      Dashed teal connector lines, circular icon nodes, one pill CTA
      bar at the foot. Flat, crisp, airy. No photography, no 3D, no serif.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left", content: "logo lockup", role: brand_slot,
         text_treatment: "wordmark at small scale beside its badge, one weight and one colour, generous clear space around it"}
      - {position: "upper-left, kicker directly above the headline", content: headline,
         text_treatment: "monospace uppercase letterspaced kicker with a small teal dot over a massive tight-tracked bold grotesque headline; the payoff line sits inside a teal gradient pill in dark-teal type"}
      - {position: "middle band, full width", content: body,
         text_treatment: "white rounded cards with soft shadows holding checklist rows or numbered teal chips; regular grotesque at reading size, one bolded phrase per row at most"}
      - {position: "foot of the frame, left-aligned", content: "CTA bar",
         text_treatment: "dark pill bar with white monospace type, or a teal gradient pill with dark-teal monospace type; one line only"}
    format_affinity: [image, carousel]
    brand_affinity: [hypelead]
    brand_slot: true
    text_density: high
    max_onimage_chars: {headline: 110, subline: 160, slide: 300}
    motion_profile: graphic
    palette: ["off-white ground #FAFAF7", "teal bright #0FCFC4", "teal mid #57E6DC", "teal deep #0A7F78", "charcoal-green #14130F"]
    typography: "Geist or an equally clean grotesque: tight-tracked bold for headlines, regular for card rows, Geist Mono uppercase letterspaced for kickers and CTA bars; never a serif, never handwriting, never an all-caps headline"
    text_placement: "kicker and headline upper-left with the payoff phrase inside the teal pill; quoted body text as card rows through the middle band, left-aligned inside their cards; the CTA pill at the foot; the logo lockup top-left with clear space around it"
    image_treatment: "flat crisp vector surfaces — dot-grid ground, one soft teal radial bloom, white rounded cards with gentle shadows, dashed teal connectors, circular icon nodes with abstract glyphs; no photography, no stock imagery, no 3D render, no busy gradient, no glassmorphism"
    visual_pacing: "airy and orderly: one headline, one highlight pill, two to four card rows, one CTA — teal appears as accent only and never floods the canvas"
    per_format_guidance:
      carousel_cover: "Cover: the headline at full scale with the teal pill on the payoff line, one card row at most, the CTA pill at the foot."
      carousel_slide: "Body slide: drop the headline to roughly half scale, keep the mono kicker, and give the middle band to the numbered cards, where a longer quoted string sets as rows at reading size. Dark mode (charcoal-green ground #14130F with vignette and teal glow) is allowed for a body slide only when the cover already used it."
    exclusions:
      - "platform UI, watermarks, app badges, usernames, @handles, follower, like or view counters"
      - "third-party channel marks and their brand colours — LinkedIn, Messenger, Instagram, WhatsApp, X, email-client glyphs: icon nodes carry invented abstract symbols only"
      - "any company, product or app logo other than a wordmark quoted in the TEXT block; the badge beside the lockup is a plain geometric mark and carries no letters"
      - "legible text inside a card's interface mock-up — those screens are wireframes of grey bars and blocks unless the string is quoted in the TEXT block"
      - "photography, 3D renders, stock illustration, serif type, handwriting, neon glow and drop-shadowed glass panels"
