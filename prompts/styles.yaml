# prompts/styles.yaml — the meta-style registry (FR-290/291, plan §1.3).
#
# This file is the VISUAL AUTHORITY of the whole product. Eight textual style definitions,
# deterministically rotated across the creatives of a run. Each one must be executable by
# GPT Image 2 without ever seeing the images it was derived from.
#
# Unlike the templates in this folder, the registry has NO built-in fallback tier: a missing,
# unreadable or invalid `styles.yaml` is a pre-flight refusal (FR-295, exit 2), never a silent
# degradation. A built-in copy would be eight styles of invisible drift.
#
# Editing rules
#   - `render_prompt` stays at or under 120 words and carries NO unresolved variant ("either
#     A or B", "Variant A/B", "teal or cobalt"). Resolve the choice here, once; a render model
#     handed a choice makes a different one every time.
#   - Cover-versus-body divergence lives in `per_format_guidance`, never in `render_prompt` —
#     `style_dna` must stay byte-identical across every slide of one deck.
#   - `exclusions` are LITERAL strings read off the reference files, scoped to those attached
#     references only. They never restrict the TEXT block: a wordmark quoted in the TEXT block
#     is always rendered, even when the same word appears in the exclusions below (the render
#     templates state this in one line of their own).
#   - `reference_images` paths resolve against the REPO ROOT (the registry spans two unrelated
#     trees, `Inspiration/` and `hypedigitaly branding/`).
#   - `max_onimage_chars` is a hard per-style cap. The copy stage only offers source strings
#     that already fit it, so a lower number here means a shorter quoted line, never a
#     truncated one. `0` means "this style carries no text of that kind at all".
#   - `brand_affinity: []` (or omitted) = brand-neutral, usable under every brand.
#     `brand_slot: true` = this style IS a brand's own house style; the branding block
#     collapses to nothing extra for it and only the TEXT-block wordmark remains.

version: 1

styles:

  - key: photoreal-ambient-caption
    render_prompt: >-
      Candid smartphone-grade photograph of a lived-in interior, shot at human eye level, close
      enough to feel present; the environment carries the message. Bright diffuse window daylight
      on pale walls, long soft shadows, no added fill light. The palette comes from the room
      itself: off-white plaster, warm grey, pale oak, one warm accent object. No graphic
      elements, no frames, no stickers, no badges, no icons. Anyone in frame stays anonymous —
      back turned, silhouetted, cropped away at the edge. One short caption in a
      regular-to-semibold neutral grotesque sans, sentence case, white with a faint drop
      shadow, set over low-detail negative space and covering under a tenth of the frame area.
      Mood: quiet, aspirational, diaristic, unstaged.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "upper-left third, over an empty wall or an unbroken surface",
         content: headline,
         text_treatment: "regular-to-semibold neutral grotesque sans, sentence case, white with a faint drop shadow, two lines maximum, always over low-detail negative space and never over the subject"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 34, subline: 0, slide: 0}
    motion_profile: photographic
    palette: ["off-white plaster #EDEAE4", "warm grey #B7B2AA", "pale oak #C2A278", "near-black shadow #14120F", "caption white #FFFFFF"]
    typography: "one neutral grotesque sans only, regular to semibold, sentence case, normal tracking; no second family, no display face, no script"
    text_placement: "a single caption block over low-detail negative space in the upper-left third; clear of the subject, clear of every edge, never more than a tenth of the frame"
    image_treatment: "candid available-light photograph with natural sensor grain and honest lens character; no graphic overlay, no sticker, no frame, no colour grade that departs from the room"
    visual_pacing: "one idea per frame; the room does the talking and the caption only names it"
    per_format_guidance:
      carousel_cover: "The cover is the widest view of the room — establish the space first; the caption sits high-left over the emptiest wall."
      carousel_slide: "Body slides move closer into the same space: one prop, one surface, one corner. Same light direction, same palette, same caption treatment as the cover."
    exclusions:
      - 'the caption "5 apps I use to run my entire business." — it appears in both reference photographs and belongs to neither this frame nor any zone of it'
      - 'the apple-shaped device mark on the desktop monitor in Informative_Photorealistic_Carousel_02.webp, and any other manufacturer logo on visible hardware'
      - 'the face or identity of the person standing at the desk in Informative_Photorealistic_Carousel_02.webp'
      - "platform UI, progress bars, player chrome, usernames, handles or engagement counters of any kind"
    reference_images:
      - "Inspiration/Tiktok and IG/Informative_Photorealistic_Carousel_02.webp"
      - "Inspiration/Tiktok and IG/Informative_Photorealistic_Carousel_03.webp"

  - key: editorial-voxel-carousel
    render_prompt: >-
      Magazine-cover slide on a flat warm-cream field. The headline is a high-contrast Didone
      serif at very large size, stacked in two to three lines, near-black with one saturated
      teal phrase; a small tracked-out uppercase sans kicker sits directly above it and a thin
      teal double rule underneath. The hero object fills the lower half: one physically rendered
      voxel toy figure with a matte moulded surface, lit like studio product photography with soft
      contact shadows on the cream. Hand-drawn teal accents — four-point sparkles, motion
      ticks, one script annotation with an arrow. Supporting graphics allowed: an
      icon-and-label list column, a dark terminal-window card. Tolerates dense text. Energy:
      playful-premium print editorial.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left corner", content: "slide-position badge",
         text_treatment: "outlined rounded-rectangle chip, small bold sans; carries the slide position and nothing else"}
      - {position: "upper 40 percent, full width, kicker directly above the headline",
         content: headline,
         text_treatment: "tracked-out uppercase sans kicker over a Didone serif headline in two or three lines, near-black with one saturated teal phrase, thin teal double rule beneath"}
      - {position: "left column of the middle band, or one annotation line under the headline",
         content: body,
         text_treatment: "icon-and-label rows in medium sans, or a single handwritten-script line in teal with a drawn arrow"}
      - {position: "top-right corner", content: "swipe cue",
         text_treatment: "hand-drawn teal arrow glyph only — a mark, never a lettered word, unless a swipe string is quoted in the TEXT block"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 90, subline: 60, slide: 90}
    motion_profile: graphic
    palette: ["warm cream ground #F6F0E4", "near-black #14120F", "teal accent #0C8897", "paper shadow grey #CFC7B8", "white card #FFFFFF"]
    typography: "high-contrast Didone serif for the headline (large, tightly leaded), tracked-out uppercase grotesque sans for kickers and labels, one handwritten script for annotations only"
    text_placement: "kicker and headline stack in the upper 40 percent; supporting labels run down the left column; corner chips top-left and top-right; the hero object owns the lower half"
    image_treatment: "physically rendered voxel or glossy 3D props photographed as studio product shots with soft contact shadows on a flat cream field; hand-drawn ink accents in the accent colour"
    visual_pacing: "loud headline, quiet ground, one hero object; every slide repeats the same three-part rhythm of kicker, headline, object"
    per_format_guidance:
      carousel_cover: "The cover carries the full stacked headline with the teal payoff phrase and the largest hero object; the badge reads position 1."
      carousel_slide: "Body slides shrink the headline by roughly a third, keep the kicker, and give the freed middle band to the icon-and-label list or the terminal card. Same cream, same rule, same corner chips."
    exclusions:
      - 'every legible string in Informative_Carousel_01.png: "GRILL-ME-CODEX", "TWO MODELS, ONE PLAN", "TWO IS BETTER THAN ONE", "How to Combine", "Claude Code", "Codex", "swipe", "01 / 10"'
      - 'every legible string in Informative_Carousel_03.png: "THE 4-STEP BUILD", "Build Your", "JARVIS OS", "by the last step, it runs your whole day", "CLAUDE CODE", "The engine", "OBSIDIAN", "The memory", "LOCAL VOICE", "Ears + mouth", "ONE HUD", "The face", "> speak", "> route", "> remember", "> RUNS YOUR WHOLE DAY_"'
      - "the real product icons on the reference list rows — the orange starburst, the violet gem, the blue voice-wave, the four-square grid — and any other identifiable app or company mark; invented abstract glyphs only"
      - 'the Instagram overlay "Najdi podobný obsah", its search field, its play triangle and its pagination dots'
    reference_images:
      - "Inspiration/Tiktok and IG/Informative_Carousel_01.png"
      - "Inspiration/Tiktok and IG/Informative_Carousel_03.png"

  - key: letterpress-print-carousel
    render_prompt: >-
      Risograph and letterpress poster grammar: one paper tone plus exactly two ink colours,
      with visible paper grain, distressed ink texture inside the letterforms and slight
      misregistration at the edges of solids. Type does the work — a towering display face set
      tight and huge, with one phrase set apart in the second ink; body copy in a lighter weight of the same family, left-aligned, four lines at
      most. Hand-drawn marker underlines, circled cues and one small pixel-art mascot sit in
      the accent ink. Any screenshot inset rides on a white card held by translucent tape
      strips and shows invented, generic interface. Nothing glossy, nothing gradient. High
      text tolerance.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left corner", content: "slide-position badge",
         text_treatment: "outlined rounded-rectangle chip in the accent ink, small tracked caps; the slide position only"}
      - {position: "top two-thirds on the cover, upper-left third with a generous margin on a body slide",
         content: headline,
         text_treatment: "towering display type set tight, one ink for the setup lines and the second ink (or a reversed black bar) for the payoff phrase"}
      - {position: "middle band, left-aligned", content: body,
         text_treatment: "lighter weight of the headline family, two to four lines, generous leading, one hand-drawn marker underline allowed"}
      - {position: "lower-right, or top-right on a body slide", content: "swipe cue",
         text_treatment: "hand-drawn circled arrow in the accent ink — a drawn mark, never a lettered word, unless a swipe string is quoted in the TEXT block"}
    format_affinity: [carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 110, subline: 60, slide: 110}
    motion_profile: graphic
    palette: ["aged cream paper #E8DCC3", "terracotta ground #B5573C", "black ink #1A1714", "vermilion ink #E2522B", "cream ink #F3E9D8"]
    typography: "condensed woodtype-style uppercase display for covers, ultra-heavy geometric lowercase sans for body slides, one lighter weight of the same sans for paragraphs; hand-drawn marker for annotations"
    text_placement: "headline owns the top two-thirds of a cover and the upper-left third of a body slide; paragraphs in the middle band, left-aligned; chips and cues in the corners"
    image_treatment: "flat printed inks on textured paper with grain and distress; pixel-art mascot as the only illustration; screenshot insets taped onto white cards, never bleeding to the edge"
    visual_pacing: "one enormous typographic statement per slide, one supporting paragraph, one drawn mark — the paper is the ground and never a photograph"
    per_format_guidance:
      carousel_cover: "Aged cream paper with visible grain. The headline is towering condensed woodtype-style uppercase filling two thirds of the frame: black ink for the setup lines, vermilion for the payoff line, distressed ink texture inside every letterform. A hand-circled swipe cue lower-right, the outlined slide-counter chip top-left."
      carousel_slide: "Saturated terracotta ground with film grain. The headline is lowercase ultra-heavy geometric sans in cream with one phrase reversed inside a solid black highlight bar; the body paragraph sits in the middle band in a lighter cream weight. Insets ride on a taped white card. Slide-counter chip top-left in mono caps."
    exclusions:
      - 'every legible string in Informative_Carousel_05.png: "CLAUDE TOKENS", "USAGE HACKS", "01 / 10", "STOP BURNING YOUR LIMITS", "MAKE CLAUDE CODE", "20x CHEAPER", "5 usage hacks most people have never heard of", "SWIPE >>"'
      - 'every legible string in Informative_Carousel_04.png: "JUN ©2026 · CHASE AI · 03 / 07", "PLUGIN 02 / IMPECCABLE", "impeccable kills the ai slop in your ui.", "Audits your frontend for the 24 design tells — purple gradients, bounce easing, cramped padding — and fixes them before they ship.", "03 / 07", "SWIPE"'
      - 'the author signature "CHASE AI" in the top mono rule of Informative_Carousel_04.png — a real account name, never a footer to reproduce'
      - 'the website mock-up inside the taped card of Informative_Carousel_04.png and every string on it: "NEO MIRAI AI DESIGN CONFERENCE", "Tokyo 2042", "01 · VISUALIZE", "02 · SHAPE", "03 · LIVE BUILD" — any inset interface must be invented and wordless or greeked'
      - 'the Instagram overlay "Najdi podobný obsah", its search field, its play triangle and its pagination dots'
    reference_images:
      - "Inspiration/Tiktok and IG/Informative_Carousel_05.png"
      - "Inspiration/Tiktok and IG/Informative_Carousel_04.png"

  - key: meme-caricature-panels
    render_prompt: >-
      Two stacked comic panels of equal height with thin black frames on a warm paper ground,
      built as a before-and-after contrast: the top panel is chaotic and overloaded, the
      bottom panel calm and smug. The technique is ink-outline caricature with gouache and
      watercolour shading; exaggerated posture and accumulated clutter carry the joke. Warm
      tungsten light, sepia-leaning palette in the top panel; one saturated violet-blue
      character is the focal note in the bottom panel. Each panel is captioned by a single
      heavy condensed sans headline in black, sentence case with a terminal period, set on the
      paper margin above the artwork — never inside it. One short line per panel, nothing
      more. Energy: dry, deadpan, shareable.
    subject_mode: scene_open
    layout_zones:
      - {position: "paper margin above each of the two panels, centred", content: headline,
         text_treatment: "heavy condensed sans in black, sentence case with a terminal period, one line per panel, never overlapping the artwork"}
      - {position: "bottom paper margin, centred", content: "signature line", role: brand_slot,
         text_treatment: "tiny letterspaced uppercase sans in warm grey, one line, well clear of the lower panel frame"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 38, subline: 38, slide: 38}
    motion_profile: graphic
    palette: ["warm paper #EFE6D2", "ink black #1B1815", "sepia shadow #8A6A46", "tungsten glow #E9B36A", "violet-blue focal #4A3FA8"]
    typography: "one heavy condensed sans for the panel captions, sentence case with terminal periods; a tiny letterspaced uppercase cut for the footer; no third family"
    text_placement: "captions live in the paper margin above each panel; the artwork itself carries no lettering at all; the footer line sits in the bottom margin"
    image_treatment: "ink-outline caricature with gouache and watercolour shading, visible paper tooth, warm tungsten lighting; clutter in the top panel, clean space in the bottom"
    visual_pacing: "two beats and a punchline: overloaded above, serene below, one line of copy each"
    per_format_guidance:
      carousel_role: slides_only
      carousel_slide: "Inside a deck this style is a body slide only — never the cover. Each slide is its own complete two-panel joke on the deck's shared paper ground, with the same frame weight and the same caption treatment as its neighbours."
    exclusions:
      - 'both panel captions of SuperFunny_Polarizing_MemeStyle_Caricature_Promotional_01.png: "Your ops team at 11 PM." and "The AI agent at 11 PM."'
      - 'the letterspaced footer wordmark "HYPEDIGITALY" printed at the bottom margin of the reference — the footer slot is filled from the TEXT block or left empty, never copied from the picture'
      - "the likeness of the person drawn in the top panel, and any readable text on the sticky notes, papers or monitor inside either panel — paperwork stays illegible scrawl"
    reference_images:
      - "Inspiration/Tiktok and IG/SuperFunny_Polarizing_MemeStyle_Caricature_Promotional_01.png"

  - key: anime-noir-statement
    render_prompt: >-
      Cinematic anime key visual: a hooded figure seen from behind at a multi-monitor desk,
      face never shown, dwarfed by a rain-streaked window onto a night-city bokeh skyline.
      Painterly cel shading with heavy rim light from the screens, glowing abstract light
      ribbons on the displays, one warm practical lamp against a cool blue-teal night palette;
      the bottom quarter of the frame falls to near-black. Over that dark band sits a two-line
      display serif headline at poster scale, white with exactly one word in saturated teal,
      tight leading and a terminal period. Below it a thin hairline rule and a small
      letterspaced uppercase footer slot. One statement sentence, nothing longer. Mood:
      nocturnal, obsessive, quietly triumphant.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "lower third, left-aligned over the darkened foreground band", content: headline,
         text_treatment: "display serif at poster scale, two lines, tight leading, white with exactly one word in saturated teal, terminal period"}
      - {position: "very bottom, centred, flanked by hairline rules", content: "signature line",
         role: brand_slot,
         text_treatment: "small letterspaced uppercase sans in teal-tinted white, one line, hairline rule left and right"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 46, subline: 0, slide: 0}
    motion_profile: photographic
    palette: ["night blue-black #0B1016", "screen teal #17B7B0", "warm lamp amber #E8A64C", "city bokeh white #DCE7F2", "foreground near-black #05070A"]
    typography: "one display serif for the statement, white with a single teal word; one small letterspaced uppercase sans for the footer; nothing else"
    text_placement: "the statement occupies the lower third over the darkest band; the footer sits at the very bottom between hairline rules; the upper two thirds stay picture"
    image_treatment: "painterly anime cel shading with heavy screen rim light, rain-streaked glass, deep bokeh city depth, abstract light ribbons instead of readable displays"
    visual_pacing: "one figure, one window, one sentence — the frame darkens downward into the words"
    per_format_guidance:
      carousel_role: cover_only
      carousel_cover: "In a deck this style is the cover and only the cover: the widest night view, the statement in the lower third, the footer rule closing the frame. Later slides belong to the deck's other body grammar and never repeat this key visual."
    exclusions:
      - 'both headline lines of AnimeStyle_Polarizing_Captivating_Promotional_02.png: "Zatímco spíte," and "AI pracuje."'
      - 'the letterspaced footer wordmark "HYPEDIGITALY" between the hairline rules of the reference — that slot is filled from the TEXT block or left empty, never copied from the picture'
      - "readable interface content on the monitors — the screens carry abstract light ribbons only, no windows, no code, no dashboards, no logos"
      - "any recognisable face; the figure is seen from behind and stays anonymous"
    reference_images:
      - "Inspiration/Tiktok and IG/AnimeStyle_Polarizing_Captivating_Promotional_02.png"

  - key: ugc-tabletop-statement
    render_prompt: >-
      First-person photorealistic tabletop scene shot from roughly thirty degrees above the
      surface: a worn wood table with everyday work props — a closed laptop, a speckled
      ceramic mug, a paper notebook, a pen — arranged casually, shallow depth of field, a home
      kitchen softly blurred behind. Golden-hour side light with long warm
      shadows; a palette of honey wood, oat, cream and speckled ceramic neutrals. It reads as
      an unstaged phone photo posted by a real person, not as product photography. Typography:
      a heavy rounded-humanist sans in white, sentence case, two to three short lines with
      tight leading, placed over the defocused upper region. Two sentences at most. Mood:
      relieved, settled, an understated brag.
    subject_mode: scene_fixed
    layout_zones:
      - {position: "upper third, left-aligned over the blurred background band", content: headline,
         text_treatment: "heavy rounded-humanist sans in white, sentence case, two to three short lines with tight leading, no backing plate, no outline"}
    format_affinity: [image, carousel, reel]
    brand_affinity: []
    brand_slot: false
    text_density: minimal
    max_onimage_chars: {headline: 70, subline: 0, slide: 0}
    motion_profile: photographic
    palette: ["honey wood #B07C4A", "oat linen #DCCFB8", "cream ceramic #EFE7D8", "warm shadow #4A3624", "text white #FFFFFF"]
    typography: "one heavy rounded-humanist sans in white, sentence case, tight leading; no second family, no all-caps, no script"
    text_placement: "one statement block in the upper third over the defocused background, left-aligned, clear of every prop and every edge"
    image_treatment: "photoreal phone-camera capture, golden-hour side light, shallow depth of field, honest lens softness; no studio lighting, no styled flat lay, no colour grade"
    visual_pacing: "one table, one statement, one warm light — the props are lived-in, never arranged for the camera"
    per_format_guidance:
      carousel_role: slides_only
      carousel_slide: "Inside a deck this style is a body slide only — never the cover. Each slide is a different corner of the same table under the same light: one prop moves, the statement block keeps its position, size and treatment."
    exclusions:
      - 'both statement lines of UGC_Style_Polarizing_Captivating_StrongStatement.png: "Monday without manual spreadsheet work." and "We got used to that fast."'
      - "any readable handwriting in the notebook of the reference — writing on props stays illegible scrawl, never legible words"
      - "manufacturer logos or brand marks on the laptop, the mug, the pen or any other prop"
    reference_images:
      - "Inspiration/Tiktok and IG/UGC_Style_Polarizing_Captivating_StrongStatement.png"

  - key: platform-showcase-card
    render_prompt: >-
      Flat ecru canvas with generous whitespace and a strict vertical stack: a small
      tracked-out uppercase kicker in teal; an oversized tight-tracking geometric sans
      headline in near-black across two lines with one phrase switched to teal; then a large
      centred browser-window mock-up — rounded corners, three traffic-light dots, pale chrome
      bar — holding an invented interface rendered as a wireframe with greeked grey bars where
      copy would sit; then a two-line explanatory caption in a regular sans; then a
      hairline-flanked signature slot at the foot. Soft card shadow only, no gradient on the
      canvas, no photography. High text tolerance. Mood: announcement, product-launch
      clarity.
    subject_mode: scene_open
    layout_zones:
      - {position: "upper quarter, centred, kicker immediately above the headline",
         content: headline,
         text_treatment: "tracked-out uppercase teal kicker over an oversized tight-tracking geometric sans headline in near-black, two lines, one phrase in teal"}
      - {position: "centre of the frame", content: "browser-window mock-up",
         text_treatment: "no lettering inside the window — greeked grey bars and blocks stand in for every string"}
      - {position: "directly beneath the browser card, centred", content: body,
         text_treatment: "regular sans, two lines, near-black at reading size"}
      - {position: "foot of the frame, centred between hairline rules", content: "signature line",
         role: brand_slot,
         text_treatment: "small letterspaced uppercase sans, one line, hairline rule left and right"}
    format_affinity: [image, carousel]
    brand_affinity: []
    brand_slot: false
    text_density: high
    max_onimage_chars: {headline: 100, subline: 60, slide: 100}
    motion_profile: graphic
    palette: ["ecru canvas #F4EFE2", "near-black #16151A", "teal accent #0C8897", "card white #FFFFFF", "chrome grey #D6D2C8"]
    typography: "one tight-tracking geometric sans across the whole card: tracked-out uppercase for the kicker and footer, oversized bold for the headline, regular for the caption"
    text_placement: "strict vertical stack — kicker, headline, browser card, two-line caption, signature slot; everything centred, everything margined generously"
    image_treatment: "flat vector-clean canvas with one soft card shadow; the only depth in the frame is the browser window floating over the ecru; no gradients, no photography, no 3D"
    visual_pacing: "announcement rhythm: a whisper, a shout, a demonstration, a footnote"
    per_format_guidance:
      carousel_cover: "The cover shows the whole browser card at its largest, with the headline at full scale and the signature slot closing the frame."
      carousel_slide: "Body slides keep the stack but shrink the browser card to make room for the caption; the kicker changes wording only through the TEXT block, never in size or colour."
    exclusions:
      - 'every legible string in Informative_Single_Platform_Showcase.png: "NOVÝ TREND", "Firma bez webu?", "Do večera to jde.", "Claude napíše texty z vašich recenzí.", "Lovable z nich postaví web."'
      - 'the third-party product name "Lovable" and its strings inside the browser mock-up: "Build apps and websites by chatting with AI", "Build something lovable" — the in-browser interface must be invented and greeked'
      - 'the gradient heart logomark above the headline of the reference, and any other identifiable company or product logo'
      - 'the two-weight footer wordmark "HYPEDIGITALY" at the foot of the reference — that slot is filled from the TEXT block or left empty, never copied from the picture'
    reference_images:
      - "Inspiration/Tiktok and IG/Informative_Single_Platform_Showcase.png"

  - key: hypelead-brand-card
    render_prompt: >-
      Minimal premium SaaS brand card. Warm off-white ground (#FAFAF7) carrying a faint
      dot-grid texture and one soft teal radial bloom in a corner. A massive tight-tracked
      bold grotesque headline in near-black, sentence case, two to three lines, with the
      payoff phrase set inside a rounded-rectangle teal gradient highlight pill (#57E6DC to
      #0FCFC4) in dark-teal type with a soft glow beneath it. A monospace uppercase
      letterspaced kicker with a small teal dot sits above the headline. White rounded cards
      with gentle shadows hold checklists, numbered teal chips and clean invented interface
      mock-ups. Dashed teal connector lines, circular icon nodes, one pill CTA bar at the
      foot. Flat, crisp, airy. No photography, no 3D, no serif.
    subject_mode: scene_open
    layout_zones:
      - {position: "top-left", content: "logo lockup", role: brand_slot,
         text_treatment: "wordmark at small scale beside its badge, one weight and one colour, generous clear space around it"}
      - {position: "upper-left, kicker directly above the headline", content: headline,
         text_treatment: "monospace uppercase letterspaced kicker with a small teal dot over a massive tight-tracked bold grotesque headline; the payoff line sits inside a teal gradient pill in dark-teal type"}
      - {position: "middle band, full width", content: body,
         text_treatment: "white rounded cards with soft shadows holding checklist rows or numbered teal chips; regular grotesque at reading size, one bolded phrase per row at most"}
      - {position: "foot of the frame, left-aligned", content: "CTA bar",
         text_treatment: "dark pill bar with white monospace type, or a teal gradient pill with dark-teal monospace type; one line only"}
    format_affinity: [image, carousel]
    brand_affinity: [hypelead]
    brand_slot: true
